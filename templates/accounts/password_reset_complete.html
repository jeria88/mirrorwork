{% extends 'base.html' %}
{% block title %}Contraseña actualizada — Endonautas{% endblock %}
{% block extra_head %}
<style>
  .auth-wrap { min-height: calc(100vh - 60px); display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
  .auth-box { width: 100%; max-width: 400px; text-align: center; }
  .icon { font-size: 3rem; margin-bottom: 1.5rem; }
  .auth-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; }
  .auth-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }
</style>
{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <div class="icon">✅</div>
    <div class="auth-title">Contraseña actualizada</div>
    <p class="auth-sub">Ya puedes entrar con tu nueva contraseña.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary">Iniciar sesión</a>
  </div>
</div>
{% endblock %}
