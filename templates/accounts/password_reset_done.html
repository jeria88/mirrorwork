{% extends 'base.html' %}
{% block title %}Revisa tu correo — Endonautas{% endblock %}
{% block extra_head %}
<style>
  .auth-wrap { min-height: calc(100vh - 60px); display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
  .auth-box { width: 100%; max-width: 400px; text-align: center; }
  .icon { font-size: 3rem; margin-bottom: 1.5rem; }
  .auth-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; }
  .auth-sub { color: var(--muted); font-size: 0.9rem; line-height: 1.7; }
</style>
{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <div class="icon">📬</div>
    <div class="auth-title">Revisa tu correo</div>
    <p class="auth-sub">Si existe una cuenta con ese email, recibirás un enlace en los próximos minutos.<br><br>El enlace expira en 1 hora.</p>
  </div>
</div>
{% endblock %}
