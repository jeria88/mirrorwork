<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CGM — Content Generation</title>
<style>
:root {
  --cgm-bg: #0a0b14;
  --cgm-surface: #12131e;
  --cgm-surface-2: #1a1b2e;
  --cgm-border: rgba(255,255,255,0.06);
  --cgm-border-2: rgba(255,255,255,0.1);
  --cgm-text: #e8e6f0;
  --cgm-text-2: #9a9ab0;
  --cgm-text-3: #5a5a70;
  --cgm-accent: #c4813a;
  --cgm-accent-2: #d4914a;
  --cgm-green: #4caf7d;
  --cgm-red: #e06060;
  --cgm-blue: #5b8def;
  --cgm-radius: 12px;
  --cgm-radius-sm: 8px;
  --cgm-shadow: 0 4px 24px rgba(0,0,0,0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--cgm-bg); color: var(--cgm-text); font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; min-height: 100vh; }
.cgm-wrap { padding: 2rem; max-width: 1400px; margin: 0 auto; }
.cgm-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
.cgm-header h1 { font-size: 1.8rem; font-weight: 700; color: var(--cgm-text); margin: 0; }
.cgm-header h1 span { color: var(--cgm-accent); }
.cgm-header-sub { color: var(--cgm-text-2); font-size: 0.85rem; margin-top: 4px; }

/* Nav tabs */
.cgm-nav { display: flex; gap: 4px; margin-bottom: 2rem; border-bottom: 1px solid var(--cgm-border); }
.cgm-nav a { padding: 12px 24px; color: var(--cgm-text-2); text-decoration: none; font-size: 0.9rem; font-weight: 500; border-radius: var(--cgm-radius-sm) var(--cgm-radius-sm) 0 0; border: 1px solid transparent; border-bottom: none; }
.cgm-nav a:hover { color: var(--cgm-text); background: var(--cgm-surface); }
.cgm-nav a.active { color: var(--cgm-accent); background: var(--cgm-surface); border-color: var(--cgm-border); border-bottom-color: var(--cgm-surface); margin-bottom: -1px; }

/* Cards */
.cgm-card { background: var(--cgm-surface); border: 1px solid var(--cgm-border); border-radius: var(--cgm-radius); padding: 1.5rem; margin-bottom: 1rem; }
.cgm-card:hover { border-color: var(--cgm-border-2); }

/* Buttons */
.cgm-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--cgm-radius-sm); font-size: 0.85rem; font-weight: 500; text-decoration: none; cursor: pointer; border: 1px solid var(--cgm-border); color: var(--cgm-text-2); background: transparent; transition: all 0.15s; font-family: inherit; }
.cgm-btn:hover { color: var(--cgm-text); border-color: var(--cgm-border-2); background: var(--cgm-surface-2); }
.cgm-btn-primary { background: var(--cgm-accent); border-color: var(--cgm-accent); color: #000; }
.cgm-btn-primary:hover { background: var(--cgm-accent-2); color: #000; }
.cgm-btn-green { background: var(--cgm-green); border-color: var(--cgm-green); color: #000; }
.cgm-btn-green:hover { background: #5cbd8d; color: #000; }
.cgm-btn-red { background: transparent; border-color: var(--cgm-red); color: var(--cgm-red); }
.cgm-btn-red:hover { background: var(--cgm-red); color: #fff; }
.cgm-btn-sm { padding: 5px 12px; font-size: 0.78rem; }
.cgm-btn-block { width: 100%; justify-content: center; }

/* Form */
.cgm-form-group { margin-bottom: 1rem; }
.cgm-form-group label { display: block; font-size: 0.75rem; color: var(--cgm-text-2); margin-bottom: 4px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
.cgm-input, .cgm-textarea, .cgm-select { width: 100%; background: var(--cgm-bg); border: 1px solid var(--cgm-border); border-radius: var(--cgm-radius-sm); padding: 10px 14px; color: var(--cgm-text); font-size: 0.9rem; outline: none; font-family: inherit; }
.cgm-textarea { min-height: 80px; resize: vertical; }
.cgm-input:focus, .cgm-textarea:focus, .cgm-select:focus { border-color: var(--cgm-accent); }

/* Badge */
.cgm-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 600; }
.cgm-badge-draft { background: rgba(107,104,128,0.2); color: #9a96a8; }
.cgm-badge-review { background: rgba(224,192,64,0.2); color: #e0c040; }
.cgm-badge-approved { background: rgba(76,175,125,0.2); color: #4caf7d; }
.cgm-badge-published { background: rgba(91,141,239,0.2); color: #5b8def; }

/* Loading */
.cgm-loading { display: none; text-align: center; padding: 2rem; }
.cgm-loading.active { display: block; }
.cgm-spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--cgm-border); border-top-color: var(--cgm-accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast */
.cgm-toast { position: fixed; bottom: 24px; right: 24px; background: var(--cgm-surface-2); border: 1px solid var(--cgm-border); border-radius: var(--cgm-radius-sm); padding: 12px 20px; color: var(--cgm-text); font-size: 0.85rem; z-index: 2000; box-shadow: var(--cgm-shadow); display: none; }
.cgm-toast.show { display: block; }
.cgm-toast-success { border-left: 3px solid var(--cgm-green); }
.cgm-toast-error { border-left: 3px solid var(--cgm-red); }

/* Empty state */
.cgm-empty { text-align: center; padding: 3rem 1rem; color: var(--cgm-text-2); }
.cgm-empty-icon { font-size: 2rem; margin-bottom: 0.5rem; opacity: 0.5; }

/* Grid */
.cgm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }

/* Card internals */
.cgm-card-title { font-size: 0.95rem; font-weight: 600; color: var(--cgm-text); margin-bottom: 6px; line-height: 1.3; }
.cgm-card-meta { font-size: 0.75rem; color: var(--cgm-text-3); margin-bottom: 8px; }
.cgm-card-body { font-size: 0.82rem; color: var(--cgm-text-2); line-height: 1.5; margin-bottom: 12px; }
.cgm-card-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* Stats */
.cgm-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
.cgm-stat { background: var(--cgm-surface); border: 1px solid var(--cgm-border); border-radius: var(--cgm-radius); padding: 1.25rem; text-align: center; }
.cgm-stat-n { font-size: 2rem; font-weight: 700; color: var(--cgm-accent); line-height: 1; }
.cgm-stat-l { font-size: 0.75rem; color: var(--cgm-text-2); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.04em; }

/* Modal */
.cgm-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
.cgm-modal-overlay.active { display: flex; }
.cgm-modal { background: var(--cgm-surface); border: 1px solid var(--cgm-border-2); border-radius: var(--cgm-radius); width: 90%; max-width: 560px; max-height: 90vh; overflow-y: auto; box-shadow: var(--cgm-shadow); }
.cgm-modal-header { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--cgm-border); }
.cgm-modal-header h2 { font-size: 1rem; font-weight: 600; color: var(--cgm-text); margin: 0; }
.cgm-modal-close { background: none; border: none; color: var(--cgm-text-2); font-size: 1.4rem; cursor: pointer; line-height: 1; padding: 0; }
.cgm-modal-close:hover { color: var(--cgm-text); }
.cgm-modal-body { padding: 1.5rem; }
.cgm-modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--cgm-border); display: flex; justify-content: flex-end; gap: 8px; }

/* Toolbar */
.cgm-toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
.cgm-search { position: relative; flex: 1; min-width: 200px; }
.cgm-search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 0.85rem; pointer-events: none; }
.cgm-search input { width: 100%; background: var(--cgm-bg); border: 1px solid var(--cgm-border); border-radius: var(--cgm-radius-sm); padding: 8px 12px 8px 34px; color: var(--cgm-text); font-size: 0.85rem; outline: none; }
.cgm-search input:focus { border-color: var(--cgm-accent); }

@media (max-width: 768px) {
  .cgm-wrap { padding: 1rem; }
  .cgm-nav { overflow-x: auto; }
}
</style>
</head>
<body>
<div class="cgm-wrap">
  <div class="cgm-header">
    <div>
      <h1>✦ CGM <span>Content Generation</span></h1>
      <div class="cgm-header-sub">Artículo → Copy RRSS → Slides → PNG</div>
    </div>
  </div>

  <nav class="cgm-nav">
    <a href="{% url 'cgm:dashboard' %}" class="{% if tab == 'dashboard' %}active{% endif %}">Dashboard</a>
    <a href="{% url 'cgm:articles' %}" class="{% if tab == 'articles' %}active{% endif %}">Artículos</a>
    <a href="{% url 'cgm:rrss' %}" class="{% if tab == 'rrss' %}active{% endif %}">RRSS</a>
  </nav>

  {% block cgm_content %}{% endblock %}
</div>

<div class="cgm-toast" id="cgmToast"></div>

<script>
function showToast(msg, type) {
  const t = document.getElementById('cgmToast');
  t.textContent = msg;
  t.className = 'cgm-toast show cgm-toast-' + (type || 'success');
  setTimeout(() => t.className = 'cgm-toast', 3000);
}
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
function copyText(btn, text) {
  navigator.clipboard.writeText(text);
  const orig = btn.innerHTML;
  btn.innerHTML = '✓ Copiado';
  setTimeout(() => btn.innerHTML = orig, 2000);
}
</script>
{% block cgm_scripts %}{% endblock %}
</body>
</html>
