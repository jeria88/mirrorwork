<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>MirrorWork VR</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; overflow:hidden; font-family:system-ui,sans-serif; }

    /* ── Overlay de entrada ── */
    #overlay {
      position:fixed; inset:0; z-index:200;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:#000; color:#fff; text-align:center; padding:2rem;
    }
    .ov-tag  { font-size:.7rem; letter-spacing:.35em; text-transform:uppercase; color:#4ecdc4; margin-bottom:.5rem; }
    .ov-name { font-size:2rem; font-weight:300; margin-bottom:1.5rem; }
    .ov-hint { font-size:.78rem; color:#7070a0; line-height:2; margin-bottom:2rem; }
    #btn-vr  {
      padding:.9rem 2.5rem; border:1px solid #4ecdc4; border-radius:100px;
      background:transparent; color:#4ecdc4; font-size:.95rem; letter-spacing:.08em;
      cursor:pointer; touch-action:manipulation; transition:background .2s;
    }
    #btn-vr:active { background:rgba(78,205,196,.15); }
    .desk-hint { font-size:.65rem; color:#3a3a5a; margin-top:1.5rem; letter-spacing:.06em; }

    /* ── Botón volver ── */
    #btn-back {
      position:fixed; top:1rem; left:1rem; z-index:100; display:none;
      font-size:.7rem; letter-spacing:.12em; text-transform:uppercase;
      color:rgba(255,255,255,.4); text-decoration:none;
      padding:.4rem .8rem; border:1px solid rgba(255,255,255,.1); border-radius:100px;
    }
    #btn-back:hover { color:#4ecdc4; border-color:#4ecdc4; }

    /* ── Reticle (gaze) ── */
    #reticle {
      position:fixed; left:50%; top:50%;
      transform:translate(-50%,-50%);
      pointer-events:none; z-index:50; display:none;
    }

    /* ── Section label ── */
    #section-label {
      position:fixed; top:1rem; left:50%; transform:translateX(-50%);
      font-size:.65rem; letter-spacing:.3em; text-transform:uppercase;
      color:#4ecdc4; z-index:100; opacity:0; transition:opacity .4s;
      pointer-events:none; white-space:nowrap; display:none;
    }

    /* ── Micrófono ── */
    #btn-mic {
      position:fixed; bottom:1rem; right:1.2rem; z-index:100; display:none;
      width:52px; height:52px; border-radius:50%;
      border:2px solid rgba(78,205,196,.35); background:rgba(0,0,0,.7);
      color:#4ecdc4; font-size:1.3rem; cursor:pointer; touch-action:manipulation;
      transition:border-color .2s, background .2s;
    }
    #btn-mic.listening  { border-color:#e05050; color:#e05050; background:rgba(224,80,80,.12); }
    #btn-mic.processing { border-color:#f0c040; color:#f0c040; animation:pulse .8s infinite alternate; }
    @keyframes pulse { from{opacity:.5} to{opacity:1} }

    /* ── Status de voz ── */
    #vr-status {
      position:fixed; top:calc(50% + 1.5rem); left:50%; transform:translateX(-50%);
      font-size:.68rem; letter-spacing:.18em; text-transform:uppercase;
      color:rgba(78,205,196,.6); z-index:100; display:none;
      pointer-events:none; white-space:nowrap;
    }
  </style>
</head>
<body>

<div id="overlay">
  <p class="ov-tag">MirrorWork VR</p>
  <h1 class="ov-name">Hola, {{ user_name }}</h1>
  <p class="ov-hint" id="ov-hint">Coloca el teléfono en el visor.<br>Gira para explorar tu espacio interior.</p>
  <div style="display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap">
    <button id="btn-vr">⬡ Modo VR</button>
    <button id="btn-preview" style="border-color:rgba(255,255,255,.25);color:rgba(255,255,255,.5)">◻ Vista previa</button>
  </div>
  <p class="desk-hint" id="ov-desk">VR: visor cardboard · Vista previa: desktop sin split</p>
</div>

<a href="{% url 'dashboard' %}" id="btn-back">← Salir</a>

<!-- Reticle SVG con anillo de progreso de gaze -->
<svg id="reticle" viewBox="0 0 44 44" width="44" height="44">
  <circle cx="22" cy="22" r="5"  fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.2"/>
  <circle cx="22" cy="22" r="1.8" fill="rgba(255,255,255,.45)"/>
  <circle id="gaze-ring" cx="22" cy="22" r="14" fill="none"
    stroke="#4ecdc4" stroke-width="2.5"
    stroke-dasharray="87.96" stroke-dashoffset="87.96"
    transform="rotate(-90 22 22)" style="transition:stroke-dashoffset .05s linear"/>
</svg>

<div id="section-label"></div>
<button id="btn-mic" title="Hablar con el Espejo">🎤</button>
<div id="vr-status"></div>

<!-- Datos Django → JS -->
<script>
const VR = {
  userName:  "{{ user_name|escapejs }}",
  aesthetic: "{{ map_aesthetic }}",
  mapPct:    {{ map_pct }},
  tokens:    {{ token_balance }},
  completed: {{ completed_tests }},
  total:     {{ total_tests }},
  question:  "{{ onboarding_question|escapejs|truncatechars:72 }}",
  initScene: {{ initial_scene }},
  dimData:         {{ dim_data_json|safe }},
  birthTypes:      {{ birth_types_json|safe }},
  breathPatterns:  {{ breath_patterns_json|safe }},
};
const CSRF = "{{ csrf_token }}";
</script>

<script type="importmap">{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}</script>

<script type="module">
import * as THREE from 'three';
import { StereoEffect } from 'three/addons/effects/StereoEffect.js';

const PHI = 1.61803398875, PI = Math.PI, E = Math.E, SQ7 = Math.sqrt(7);

// ── Normalizar aesthetic ───────────────────────────────────────────────────
const _aes = (VR.aesthetic === 'arbol' || VR.aesthetic === 'archipielago')
  ? 'cosmos' : VR.aesthetic;

// ── Overlay por aesthetic ─────────────────────────────────────────────────
{
  const hints = {
    cosmos:      'Flota en el campo kepleriano.<br>Mira hacia el horizonte de eventos.',
    mandala:     'Estás dentro del mandala sagrado.<br>Gira para explorar la geometría.',
    psychedelic: 'El campo psicodélico te envuelve.<br>El dock cambia el entorno.',
  };
  const btns = {
    cosmos:'✦ Entrar al cosmos', mandala:'✦ Entrar al mandala', psychedelic:'✦ Entrar al campo',
  };
  document.getElementById('ov-hint').innerHTML  = hints[_aes] || hints.cosmos;
  document.getElementById('btn-vr').textContent  = btns[_aes]  || btns.cosmos;
  if (_aes === 'psychedelic')
    document.getElementById('ov-desk').textContent = 'Arrastra · Espacio: escena · Tab: panel';
}

// ── Renderer + StereoEffect ───────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const effect = new StereoEffect(renderer);
effect.eyeSeparation = 0.064;
effect.setSize(innerWidth, innerHeight);

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(90, innerWidth/innerHeight, 0.1, 600);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  effect.setSize(innerWidth, innerHeight);
});

const VERT = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`;

// ── Estado de fondo ───────────────────────────────────────────────────────
let bgUnis = { uT:{value:0}, uFade:{value:1} };
let bgMesh = null;
let _mandalaCtx = null, _mandalaTex = null;
let _psychMats = null, _psychSpeeds = null, _psychNames = null;
let curPsychScene = VR.initScene;
let vrField = null; // ref al Points de cosmos para animar diskTilt

// ── Presets VR cosmos por sección ─────────────────────────────────────────
// En VR no movemos la cámara (es el giroscopio quien lo hace)
// Cambiamos: speedInner, sizeMult, diskTilt (inclinación del disco)
const VR_COS_PRESETS = {
  hub:       { speedInner:2.6,  sizeMult:3.5, diskTilt:10  },
  espejo:    { speedInner:4.5,  sizeMult:4.0, diskTilt:75  },
  tests:     { speedInner:2.0,  sizeMult:3.0, diskTilt:25  },
  birth:     { speedInner:0.8,  sizeMult:5.5, diskTilt:5   },
  sensorial: { speedInner:6.5,  sizeMult:2.5, diskTilt:40  },
  perfil:    { speedInner:2.2,  sizeMult:4.2, diskTilt:60  },
};
let vrCosCur = { ...VR_COS_PRESETS.hub };
let vrCosTgt = { ...VR_COS_PRESETS.hub };
let _vrLerpBoost = 0;
function lerp(a,b,t){ return a+(b-a)*t; }

// ── Paletas mandala VR ────────────────────────────────────────────────────
const _MPALS = {
  arcano: [35,  15,  50 ],
  blanco: [210, 240, 220],
  nebula: [280, 320, 200],
  aurora: [45,  175, 270],
  tiempo: [140, 160, 120],
};
const VR_MAN_PRESETS = {
  hub:       { sym:8,  speed:0.09, pal:_MPALS.arcano },
  espejo:    { sym:4,  speed:0.07, pal:_MPALS.blanco },
  tests:     { sym:8,  speed:0.12, pal:_MPALS.aurora },
  birth:     { sym:4,  speed:0.05, pal:_MPALS.blanco },
  sensorial: { sym:5,  speed:0.08, pal:_MPALS.tiempo },
  perfil:    { sym:12, speed:0.06, pal:_MPALS.nebula },
};
const _MP = { sym:8, speed:0.09, pal:_MPALS.arcano, alpha:0.60, layers:5 };

// ── Escenas psychedelic por sección ──────────────────────────────────────
const VR_PSY_SCENES = {
  hub:2, espejo:1, tests:2, birth:3, sensorial:3, perfil:1,
};

// ── Fondo cosmos ──────────────────────────────────────────────────────────
if (_aes === 'cosmos') {
  const BH_R=7, N=110000, R_MIN=1.5, R_MAX=140;
  const pGeo=new THREE.BufferGeometry();
  const pPos=new Float32Array(N*3), pCol=new Float32Array(N*3);
  const pAng=new Float32Array(N),   pRad=new Float32Array(N);
  const pSpd=new Float32Array(N),   pSz=new Float32Array(N);
  for(let i=0;i<N;i++){
    let r; const roll=Math.random();
    if(roll<0.65)      r=R_MIN+Math.pow(Math.random(),1.8)*38;
    else if(roll<0.85) r=38+Math.random()*42;
    else               r=80+Math.random()*(R_MAX-80);
    const a=Math.random()*PI*2, norm=r/R_MAX;
    const thick=r<40?0.04+norm*0.3:0.3+norm*0.7;
    const y=(Math.random()-.5)*r*thick;
    pPos[i*3]=Math.cos(a)*r; pPos[i*3+1]=y; pPos[i*3+2]=Math.sin(a)*r;
    if(r<20){pCol[i*3]=0.95+Math.random()*.05;pCol[i*3+1]=0.88+Math.random()*.12;pCol[i*3+2]=0.70+Math.random()*.25;}
    else if(r<55){pCol[i*3]=0.30+Math.random()*.50;pCol[i*3+1]=0.75+Math.random()*.25;pCol[i*3+2]=0.80+Math.random()*.20;}
    else{pCol[i*3]=0.20+Math.random()*.30;pCol[i*3+1]=0.40+Math.random()*.30;pCol[i*3+2]=0.75+Math.random()*.25;}
    pAng[i]=a; pRad[i]=r;
    pSpd[i]=(1.0/Math.sqrt(r))*2.8*(0.80+Math.random()*.40);
    pSz[i]=r<20?1.2+Math.random()*1.8:0.4+norm*norm*3.0+Math.random()*.6;
  }
  pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
  pGeo.setAttribute('color',   new THREE.BufferAttribute(pCol,3));
  pGeo.setAttribute('aAngle',  new THREE.BufferAttribute(pAng,1));
  pGeo.setAttribute('aRadius', new THREE.BufferAttribute(pRad,1));
  pGeo.setAttribute('aSpeed',  new THREE.BufferAttribute(pSpd,1));
  pGeo.setAttribute('aSize',   new THREE.BufferAttribute(pSz, 1));
  const cosmosMat=new THREE.ShaderMaterial({
    uniforms:{uT:{value:0},uFade:{value:1},uSpeedInner:{value:2.6},uSpeedOuter:{value:0.05},uSizeMult:{value:3.5}},
    vertexShader:`
      uniform float uT,uSpeedInner,uSpeedOuter,uSizeMult;
      attribute float aAngle,aRadius,aSpeed,aSize;
      varying vec3 vCol; varying float vNorm;
      void main(){
        float spd=mix(uSpeedInner,uSpeedOuter,aRadius/140.0)*aSpeed;
        float ang=aAngle+uT*spd;
        vec3 pos=vec3(cos(ang)*aRadius,position.y,sin(ang)*aRadius);
        vCol=color; vNorm=aRadius/140.0;
        vec4 mv=modelViewMatrix*vec4(pos,1.0);
        gl_Position=projectionMatrix*mv;
        gl_PointSize=clamp(aSize*uSizeMult*(110.0/-mv.z),0.5,28.0);
      }`,
    fragmentShader:`
      varying vec3 vCol; varying float vNorm; uniform float uFade;
      void main(){
        vec2 c=gl_PointCoord-.5; float d=length(c);
        if(d>.5)discard;
        float core=smoothstep(.50,.00,d);
        float halo=smoothstep(.50,.18,d)*.55;
        float ring=smoothstep(.28,.12,d)*smoothstep(.04,.12,d)*.35;
        gl_FragColor=vec4(vCol*(1.0+(1.0-vNorm)*.8),(core+halo+ring)*uFade);
      }`,
    transparent:true, vertexColors:true, blending:THREE.AdditiveBlending, depthWrite:false,
  });
  bgUnis=cosmosMat.uniforms;
  vrField=new THREE.Points(pGeo,cosmosMat);
  vrField.rotation.x=VR_COS_PRESETS.hub.diskTilt*PI/180;
  scene.add(vrField);
  // Disco de acreción
  const ringMat=new THREE.ShaderMaterial({
    uniforms:{uT:bgUnis.uT},
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`varying vec2 vUv;uniform float uT;void main(){float ang=atan(vUv.y-.5,vUv.x-.5);float r=length(vUv-.5)*2.;if(r<.35||r>1.)discard;float pulse=.6+.4*sin(ang*3.+uT*1.8);float fade=smoothstep(1.,.55,r)*smoothstep(.35,.5,r);vec3 col=mix(vec3(1.,.6,.2),vec3(.3,.9,1.),(r-.35)*2.);gl_FragColor=vec4(col*pulse,fade*.7);}`,
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide,
  });
  const ring=new THREE.Mesh(new THREE.PlaneGeometry(18,18),ringMat);
  ring.rotation.x=-PI*.5; scene.add(ring);
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(BH_R,32,32),new THREE.MeshBasicMaterial({color:0x000000})));
  camera.position.set(0,22,95);

} else if (_aes === 'mandala') {
  const mCv=document.createElement('canvas'); mCv.width=mCv.height=2048;
  _mandalaCtx=mCv.getContext('2d');
  _mandalaTex=new THREE.CanvasTexture(mCv);
  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(100,64,64),
    new THREE.MeshBasicMaterial({map:_mandalaTex,side:THREE.BackSide})
  ));
  camera.position.set(0,0,0);

} else {
  // psychedelic
  const PSYCH_FRAGS=[
    `uniform float uT,uFade;varying vec2 vUv;const float PI=3.14159265,PHI=1.61803398875,SQ3=1.73205080;vec3 hsl(float h,float s,float l){float h6=fract(h)*6.,x=1.-abs(mod(h6,2.)-1.);vec3 r=h6<1.?vec3(1,x,0):h6<2.?vec3(x,1,0):h6<3.?vec3(0,1,x):h6<4.?vec3(0,x,1):h6<5.?vec3(x,0,1):vec3(1,0,x);return r*s*(.5+l*.5)+(1.-s)*l;}void main(){float a=vUv.x*PI*2.,d=vUv.y*10.-uT*1.4;float w=(sin(a*3.+d*1.1+uT*.5)+sin(a*5.*PHI-d*.9+uT*.7)+sin((a+d*.7)*2.5+uT*SQ3*.4))/3.;gl_FragColor=vec4(hsl(.50+w*.13,.85,.55)*max(0.,.35+w*.65)*uFade,1.);}`,
    `uniform float uT,uFade;varying vec2 vUv;const float PI=3.14159265,SQ2=1.41421356,SQ3=1.73205080;void main(){float a=vUv.x*PI*2.,d=vUv.y*12.-uT*2.5;float fr=3.5+sin(uT*SQ3*.3)*2.2,ro=uT*SQ2*.15;float li=pow(max(0.,sin(fr*(cos(ro)*a+sin(ro)*d)-uT*2.5)),5.);vec3 c=li<.5?mix(vec3(.03,0.,.06),vec3(.35,0.,.55),li*2.):mix(vec3(.35,0.,.55),vec3(1.,.92,1.),(li-.5)*2.);gl_FragColor=vec4(c*uFade,1.);}`,
    `uniform float uT,uFade;varying vec2 vUv;const float PI=3.14159265,PHI=1.61803398875,SQ7=2.64575131;vec3 hsl(float h,float s,float l){float h6=fract(h)*6.,x=1.-abs(mod(h6,2.)-1.);vec3 r=h6<1.?vec3(1,x,0):h6<2.?vec3(x,1,0):h6<3.?vec3(0,1,x):h6<4.?vec3(0,x,1):h6<5.?vec3(x,0,1):vec3(1,0,x);return r*s*(.5+l*.5)+(1.-s)*l;}void main(){float a=vUv.x*PI*2.,d=vUv.y*10.-uT*1.8;float A=uT*PHI*.2,f=4.+sin(uT*SQ7*.5)*3.;float act=(cos(f*(cos(A)*a+sin(A)*d)+uT*1.5)+cos(f*(cos(A+PI/3.)*a+sin(A+PI/3.)*d)-uT*1.5)+cos(f*(cos(A-PI/3.)*a+sin(A-PI/3.)*d)+uT*.75))/3.;gl_FragColor=vec4(hsl(fract(act*.5+uT*.04+vUv.x*.15),.9,.55)*(max(0.,act)*.85+.08)*uFade,1.);}`,
    `uniform float uT,uFade;varying vec2 vUv;const float PI=3.14159265,PHI=1.61803398875,LOGPHI=0.48121182506;vec3 hsl(float h,float s,float l){float h6=fract(h)*6.,x=1.-abs(mod(h6,2.)-1.);vec3 r=h6<1.?vec3(1,x,0):h6<2.?vec3(x,1,0):h6<3.?vec3(0,1,x):h6<4.?vec3(0,x,1):h6<5.?vec3(x,0,1):vec3(1,0,x);return r*s*(.5+l*.5)+(1.-s)*l;}void main(){float a=vUv.x*PI*2.,d=vUv.y*8.-uT*2.2;float sN=log(max(.001,abs(d)*.25+.1))/LOGPHI;float fib=(sin(a*8.-sN*2.+uT*1.3)*sin(a*13.+d*1.5-uT*.9)+sin((a+sN*.618)*5.+uT*PHI*.4))/2.;gl_FragColor=vec4(hsl(fract(fib*.4+a/(PI*2.)*.25+uT*.03),.85,.6)*(pow(max(0.,fib*.5+.5),1.4)*.9+.05)*uFade,1.);}`
  ];
  _psychSpeeds=[1.0,2.2,1.5,1.9];
  _psychNames=['Corriente','Obsidiana','Hexagonal','Fibonacci'];
  _psychMats=PSYCH_FRAGS.map(f=>new THREE.ShaderMaterial({uniforms:bgUnis,vertexShader:VERT,fragmentShader:f,side:THREE.BackSide}));
  bgMesh=new THREE.Mesh(new THREE.SphereGeometry(100,64,32),_psychMats[curPsychScene]);
  scene.add(bgMesh);
  camera.position.set(0,0,0);
}

// ── Dibujo mandala ────────────────────────────────────────────────────────
function _drawMandala(T) {
  if (!_mandalaCtx) return;
  const W=_mandalaCtx.canvas.width, H=_mandalaCtx.canvas.height, ctx=_mandalaCtx;
  ctx.fillStyle='#00000c'; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(W/2,H/2);
  const TAU=PI*2, sr=Math.min(W,H)*.46;
  const sym=_MP.sym, rot=T*_MP.speed, alpha=_MP.alpha, pal=_MP.pal;
  const hue=(pal[0]+T*4)%360, hue2=(pal[1]+T*3)%360, hue3=(pal[2]+T*5)%360;
  function poly(r,n,a){return()=>{ctx.moveTo(r*Math.cos(a),r*Math.sin(a));for(let i=1;i<=n;i++){const ag=a+TAU*i/n;ctx.lineTo(r*Math.cos(ag),r*Math.sin(ag));}ctx.closePath()};}
  function star(r,n,a,sk){return()=>{for(let i=0;i<=n*2;i++){const ag=a+TAU*i/(n*2),rr=i%2===0?r:r*(sk||.5);i===0?ctx.moveTo(rr*Math.cos(ag),rr*Math.sin(ag)):ctx.lineTo(rr*Math.cos(ag),rr*Math.sin(ag));}ctx.closePath()};}
  function magic(fn,h,am){
    const a=alpha*(am||1);
    ctx.beginPath();fn();ctx.strokeStyle=`hsla(${h},100%,58%,${a*.10})`;ctx.lineWidth=22;ctx.stroke();
    ctx.beginPath();fn();ctx.strokeStyle=`hsla(${h},100%,58%,${a*.35})`;ctx.lineWidth=4;ctx.stroke();
    ctx.beginPath();fn();ctx.strokeStyle=`hsla(${(h+18)%360},55%,92%,${a*.80})`;ctx.lineWidth=1.2;ctx.stroke();
  }
  [.32,.50,.65,.80,.96,1.10].slice(0,_MP.layers+1).forEach((fr,li)=>{
    const r=sr*fr, r2=rot+(li%2===0?0:PI/sym), h=li%3===0?hue:li%3===1?hue2:hue3;
    magic(poly(r,sym,r2),h,.50+li*.10);
  });
  magic(star(sr*1.12,sym,rot*.65,.42),hue,.45);
  magic(star(sr*.72,sym,rot*.45+PI/sym,.50),hue2,.38);
  magic(star(sr*.48,sym*2,rot*.80,.55),hue3,.30);
  const grad=ctx.createRadialGradient(0,0,0,0,0,sr*.10);
  grad.addColorStop(0,`hsla(${hue},100%,88%,.95)`); grad.addColorStop(1,`hsla(${hue},100%,60%,.0)`);
  ctx.beginPath(); ctx.arc(0,0,sr*.10,0,TAU); ctx.fillStyle=grad; ctx.fill();
  ctx.restore();
  if(_mandalaTex) _mandalaTex.needsUpdate=true;
}

// ── Psychedelic fade ──────────────────────────────────────────────────────
let fadeDoing=false;
function triggerFade(to){
  if(!bgMesh||!_psychMats||fadeDoing||to===curPsychScene)return; fadeDoing=true; let f=1;
  const out=()=>{f-=.07;bgUnis.uFade.value=Math.max(0,f);if(f>0){requestAnimationFrame(out);return;}
    curPsychScene=to;bgMesh.material=_psychMats[curPsychScene];

// PANEL CANVAS
// ═══════════════════════════════════════════════════════════════════════════
const PW=1024, PH=512;
const panelCanvas=document.createElement('canvas'); panelCanvas.width=PW; panelCanvas.height=PH;
const panelTex=new THREE.CanvasTexture(panelCanvas);
const PANEL_FRAG=`
  uniform sampler2D uTex; uniform float uReveal,uT; varying vec2 vUv;
  const float PI=3.14159265,PHI=1.61803398875,LOGPHI=0.48121182506;
  void main(){
    vec2 c=vUv-.5; float r=length(c),ang=atan(c.y,c.x);
    float pulse=.38*sin(uT*PI*.3731)+.26*sin(uT*PHI*.6247)+.19*sin(uT*2.71828*.4153);
    float fibVar=.12*sin(log(max(.001,r*5.))/LOGPHI*3.-ang*2.);
    float revR=uReveal+pulse*.07*uReveal*(1.-uReveal)+fibVar*uReveal*(1.-uReveal);
    float mask=smoothstep(revR+.04,revR-.02,r*1.2);
    float edge=smoothstep(revR-.10,revR,r*1.2)*smoothstep(revR+.04,revR,r*1.2);
    vec4 tex=texture2D(uTex,vUv);
    vec3 glow=vec3(.30,.85,.78);
    vec3 col=tex.rgb*mask+glow*edge*(.7+pulse*.3);
    gl_FragColor=vec4(col,max(mask*tex.a,edge*.9)*min(1.,uReveal*3.));
  }`;
const panelUnis={uTex:{value:panelTex},uReveal:{value:0.0},uT:{value:0.0}};
const panelMat=new THREE.ShaderMaterial({uniforms:panelUnis,vertexShader:VERT,fragmentShader:PANEL_FRAG,transparent:true,side:THREE.DoubleSide});
const panelMesh=new THREE.Mesh(new THREE.PlaneGeometry(3.8,1.9),panelMat); // ratio 2:1, ocupa ~60% FOV
const panelRig=new THREE.Object3D();
scene.add(panelRig); panelRig.add(panelMesh);
panelMesh.position.set(0,0.1,-3.0); // 3 unidades frente, ligeramente sobre el centro

let revealProgress=0, revealActive=false, revealFading=false;
function startReveal(from=0){revealProgress=from;revealActive=true;}
function fadePanel(cb){
  revealFading=true; revealActive=false; let f=revealProgress;
  const out=()=>{f-=.06;panelUnis.uReveal.value=Math.max(0,f);
    if(f>0){requestAnimationFrame(out);return;}
    cb(); panelTex.needsUpdate=true; revealFading=false; startReveal(0);};
  requestAnimationFrame(out);
}

// ── Helpers de canvas ─────────────────────────────────────────────────────
function _rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function wrapText(ctx,text,x,y,maxW,lineH,maxLines){
  const words=text.split(' '); let line='';
  for(let i=0;i<words.length;i++){const t=line+words[i]+' ';if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line.trim(),x,y);line=words[i]+' ';y+=lineH;if(maxLines&&--maxLines<=0){ctx.fillText('…',x,y);return y;}}else line=t;}
  if(line.trim())ctx.fillText(line.trim(),x,y); return y+lineH;
}
function _panelBg(ctx,accentRGB='78,205,196'){
  ctx.fillStyle='rgba(0,0,0,0.88)';_rr(ctx,0,0,PW,PH,32);ctx.fill();
  ctx.strokeStyle=`rgba(${accentRGB},0.30)`;ctx.lineWidth=2;_rr(ctx,1,1,PW-2,PH-2,31);ctx.stroke();
  ctx.fillStyle=`rgba(${accentRGB},0.15)`;ctx.fillRect(40,58,PW-80,1);
}

function drawDockBtn(sec, progress=0, isActive=false){
  const cv=sec.btnCanvas, ctx=cv.getContext('2d'), W=BTN_W, H=BTN_H;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=isActive?'rgba(78,205,196,.20)':'rgba(0,0,8,.78)';
  _rr(ctx,3,3,W-6,H-6,18);ctx.fill();
  ctx.strokeStyle=isActive?'rgba(78,205,196,.85)':'rgba(255,255,255,.22)';
  ctx.lineWidth=isActive?2.5:1.5;_rr(ctx,3,3,W-6,H-6,18);ctx.stroke();

  ctx.fillStyle=isActive?'#4ecdc4':'#7070a0';

  ctx.fillText(sec.label,W/2,H*.88);

    const cx=W/2,cy=H/2,r=Math.min(W,H)*.41;

// ── Raycasting para gaze ───────────────────────────────────────────────────
const raycaster=new THREE.Raycaster();
const _gazeDir=new THREE.Vector3();
const dockMeshes=VR_SECTIONS.map(s=>s.btnMesh);
const DWELL_MS=1600;
let gazeTarget=-1, gazeStart=0;
const gazeRing=document.getElementById('gaze-ring');
const GAZE_CIRC=87.96;

function updateGaze(ts){
  camera.getWorldDirection(_gazeDir);
  raycaster.set(camera.position,_gazeDir);
  const hits=raycaster.intersectObjects(dockMeshes,false);
  if(hits.length>0){
    const idx=hits[0].object.userData.secIdx;
    if(idx===gazeTarget){
      const progress=Math.min(1,(ts-gazeStart)/DWELL_MS);
      VR_SECTIONS[idx].gazeTime=progress;
      drawDockBtn(VR_SECTIONS[idx],progress,idx===curSecIdx);
      gazeRing.style.strokeDashoffset=GAZE_CIRC*(1-progress);
      if(progress>=1){gazeTarget=-1;setSection(idx);}
    } else {
      if(gazeTarget>=0){VR_SECTIONS[gazeTarget].gazeTime=0;drawDockBtn(VR_SECTIONS[gazeTarget],0,gazeTarget===curSecIdx);}
      gazeTarget=idx; gazeStart=ts;
    }
  } else {
    if(gazeTarget>=0){VR_SECTIONS[gazeTarget].gazeTime=0;drawDockBtn(VR_SECTIONS[gazeTarget],0,gazeTarget===curSecIdx);}
    gazeTarget=-1;
    gazeRing.style.strokeDashoffset=GAZE_CIRC;
  }
}

// ── Cambio de sección ─────────────────────────────────────────────────────
function setSection(idx){
  if(idx===curSecIdx&&revealProgress>0.5)return;
  const sec=VR_SECTIONS[idx];
  const prev=curSecIdx; curSecIdx=idx;

  // Fondo
  if(_aes==='cosmos'){
    Object.assign(vrCosTgt,VR_COS_PRESETS[sec.id]||VR_COS_PRESETS.hub);
    _vrLerpBoost=1;
  } else if(_aes==='mandala'){
    Object.assign(_MP,VR_MAN_PRESETS[sec.id]||VR_MAN_PRESETS.hub);
  } else if(_aes==='psychedelic'){
    triggerFade(VR_PSY_SCENES[sec.id]??0);
  }

  // Panel
  fadePanel(()=>{ sec.draw(); });

  // Dock highlights
  if(prev!==idx){drawDockBtn(VR_SECTIONS[prev],0,false);}
  drawDockBtn(VR_SECTIONS[idx],0,true);

  // Micrófono solo en espejo
  document.getElementById('btn-mic').style.display=sec.id==='espejo'?'flex':'none';

  // Label
  const lbl=document.getElementById('section-label');
  lbl.textContent=`${sec.icon} ${sec.label}`;
  lbl.style.opacity='1';
  setTimeout(()=>lbl.style.opacity='0',2200);
}

// ── Tap para activar sección apuntada ────────────────────────────────────
renderer.domElement.addEventListener('pointerdown', e=>{
  e.preventDefault();
  camera.getWorldDirection(_gazeDir);
  raycaster.set(camera.position,_gazeDir);
  const hits=raycaster.intersectObjects(dockMeshes,false);
  if(hits.length>0){ setSection(hits[0].object.userData.secIdx); return; }
  // Tap en área vacía → si en espejo, abrir mic
  if(VR_SECTIONS[curSecIdx].id==='espejo'){
    if(espejoStatus==='listening')stopListening();
    else if(espejoStatus==='idle')startListening();
  }
});

  if(VR_SECTIONS[curSecIdx].id!=='espejo')return;
  drawEspejoPanel();panelTex.needsUpdate=true;
  if(revealProgress>=0.9)startReveal(0.55);

const SR_Ctor=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null;
function startListening(){
  if(!SR_Ctor){alert('Usa Chrome en Android para voz.');return;}
  recognition=new SR_Ctor();recognition.lang='es-ES';recognition.continuous=false;recognition.interimResults=true;
  recognition.onstart=()=>{espejoStatus='listening';interimText='';setMicState('listening');setStatus('escuchando…');};
  recognition.onresult=e=>{interimText=Array.from(e.results).map(r=>r[0].transcript).join('');refreshEspejo();if(e.results[e.results.length-1].isFinal)recognition.stop();};
  recognition.onend=()=>{
    if(!interimText.trim()){espejoStatus='idle';setMicState('idle');setStatus('');refreshEspejo();return;}
    const txt=interimText.trim();interimText='';
    espejoHistory.push({role:'user',content:txt});espejoStatus='processing';setMicState('processing');setStatus('procesando…');refreshEspejo();
    sendToEspejo(txt);
  };
  recognition.onerror=()=>{espejoStatus='idle';interimText='';setMicState('idle');setStatus('');refreshEspejo();};
  recognition.start();
}
function stopListening(){if(recognition){try{recognition.stop();}catch(e){}}}
const synth=window.speechSynthesis;
let voice=null;
function pickVoice(){const vs=synth.getVoices();voice=vs.find(v=>v.lang.startsWith('es')&&v.name.includes('Google'))||vs.find(v=>v.lang.startsWith('es'))||vs[0];}
synth.addEventListener('voiceschanged',pickVoice);pickVoice();
function speak(text){
  synth.cancel();const u=new SpeechSynthesisUtterance(text);if(voice)u.voice=voice;
  u.lang='es-ES';u.rate=0.86;u.pitch=0.88;
  u.onend=()=>{espejoStatus='idle';setMicState('idle');setStatus('');refreshEspejo();};
  synth.speak(u);espejoStatus='speaking';setMicState('idle');setStatus('hablando…');
}
async function sendToEspejo(text){
  try{
    const res=await fetch('/espejo/send/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':CSRF},body:JSON.stringify({mensaje:text,sesion_id:espejoSession})});
    if(!res.ok)throw new Error(res.status);
    const data=await res.json();espejoSession=data.sesion_id;
    const r=(data.respuesta||'').trim();if(r){espejoHistory.push({role:'assistant',content:r});refreshEspejo();speak(r);}
  }catch(err){espejoStatus='idle';setMicState('idle');setStatus('Error de conexión');setTimeout(()=>setStatus(''),2000);refreshEspejo();}
}
function setMicState(s){const b=document.getElementById('btn-mic');b.className=s==='listening'?'listening':s==='processing'?'processing':'';b.textContent=s==='listening'?'⏹':'🎤';}
function setStatus(t){document.getElementById('vr-status').textContent=t;}
document.getElementById('btn-mic').addEventListener('pointerdown',e=>{e.preventDefault();if(espejoStatus==='listening')stopListening();else if(espejoStatus==='idle')startListening();});

// ── Tiempo chamánico ──────────────────────────────────────────────────────
let T=0,lastTs=0;
function tickTime(ts){
  const dt=Math.min((ts-lastTs)/1000,.05);lastTs=ts;
  if(_aes==='psychedelic'&&_psychSpeeds){
    const pulse=Math.max(.3,1+.40*Math.sin(T*PI*.3731)+.25*Math.sin(T*PHI*.6247)+.18*Math.sin(T*E*.4153)+.10*Math.sin(T*SQ7*.5289));
    T+=dt*_psychSpeeds[curPsychScene]*pulse;
  }else{T+=dt;}
  return dt;
}

// ── Gyroscope ─────────────────────────────────────────────────────────────
let dA=0,dB=90,dG=0,gyroOK=false;
const Q_SCR=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5));
const _eu=new THREE.Euler(),_qO=new THREE.Quaternion();
window.addEventListener('deviceorientation',e=>{if(e.alpha==null)return;gyroOK=true;dA=e.alpha||0;dB=e.beta||90;dG=e.gamma||0;},true);
function applyGyro(){
  const ori=Number(window.screen?.orientation?.angle??window.orientation??0);
  _eu.set(THREE.MathUtils.degToRad(dB),THREE.MathUtils.degToRad(dA),THREE.MathUtils.degToRad(-dG),'YXZ');
  camera.quaternion.setFromEuler(_eu);camera.quaternion.multiply(Q_SCR);
  _qO.setFromAxisAngle(new THREE.Vector3(0,0,1),-THREE.MathUtils.degToRad(ori));
  camera.quaternion.multiply(_qO);
}
let drag=false,px=0,py=0,yaw=0,pitch=0;
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;},{passive:true});
window.addEventListener('pointerup',()=>drag=false);
window.addEventListener('pointermove',e=>{if(!drag||gyroOK)return;yaw-=(e.clientX-px)*.003;pitch-=(e.clientY-py)*.003;pitch=Math.max(-PI/2,Math.min(PI/2,pitch));px=e.clientX;py=e.clientY;});

// Tab: navegar secciones en secuencia
document.addEventListener('keydown',e=>{
  if(e.code==='Tab'){e.preventDefault();setSection((curSecIdx+1)%VR_SECTIONS.length);}
  if(e.code==='Space'&&_aes==='psychedelic'){e.preventDefault();triggerFade((curPsychScene+1)%4);}
});

// ── Entrada ────────────────────────────────────────────────────────────────
let _useEffect=true; // true=StereoEffect (VR), false=render normal (preview)

async function enterVR(stereo){
  _useEffect=stereo;
  if(stereo && typeof DeviceOrientationEvent?.requestPermission==='function'){
    try{const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted'){alert('Permiso denegado.');return;}}catch(e){}
  }
  document.getElementById('overlay').style.display    ='none';
  document.getElementById('btn-back').style.display   ='block';
  document.getElementById('section-label').style.display='block';
  document.getElementById('vr-status').style.display  ='block';
  document.getElementById('reticle').style.display    ='block';
  drawHubPanel(); panelTex.needsUpdate=true;
  startReveal(0);
  requestAnimationFrame(loop);
}
document.getElementById('btn-vr').addEventListener('click',()=>enterVR(true));
document.getElementById('btn-preview').addEventListener('click',()=>enterVR(false));

// ── Loop ──────────────────────────────────────────────────────────────────
const _rigQ=new THREE.Quaternion();
function loop(ts){
  requestAnimationFrame(loop);
  const dt=tickTime(ts);

  // Lerp cosmos por sección
  if(_aes==='cosmos'&&vrField){
    _vrLerpBoost=Math.max(0,_vrLerpBoost-.008);
    const VL=0.018+(0.12-0.018)*_vrLerpBoost;
    vrCosCur.speedInner=lerp(vrCosCur.speedInner,vrCosTgt.speedInner,VL);
    vrCosCur.sizeMult  =lerp(vrCosCur.sizeMult,  vrCosTgt.sizeMult,  VL);
    vrCosCur.diskTilt  =lerp(vrCosCur.diskTilt,  vrCosTgt.diskTilt,  VL);
    bgUnis.uSpeedInner.value=vrCosCur.speedInner;
    bgUnis.uSizeMult.value  =vrCosCur.sizeMult;
    vrField.rotation.x      =vrCosCur.diskTilt*PI/180;
  }

  bgUnis.uT.value=T;
  if(_aes==='mandala')_drawMandala(T);
  panelUnis.uT.value=T;

  // Reveal chamánico
  if(revealActive&&revealProgress<1&&!revealFading){
    const pulse=.38*Math.sin(T*PI*.3731)+.26*Math.sin(T*PHI*.6247);
    revealProgress=Math.min(1,revealProgress+dt*(.28+Math.abs(pulse)*.18));
    panelUnis.uReveal.value=revealProgress;
  }

  // Gaze (solo si VR activo)
  if(document.getElementById('reticle').style.display!=='none')updateGaze(ts);

  // Cámara
  if(gyroOK)applyGyro();
  else{_eu.set(pitch,yaw,0,'YXZ');camera.quaternion.setFromEuler(_eu);}

  // Panel + dock siguen la cabeza
  // posición: cámara exacta; rotación: lag suave (slerp)
  panelRig.position.copy(camera.position);
  _rigQ.copy(camera.quaternion);
  panelRig.quaternion.slerp(_rigQ,.03);

  if(_useEffect)effect.render(scene,camera);
  else renderer.render(scene,camera);
}
</script>
