<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>MirrorWork VR</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; overflow:hidden; font-family:system-ui,sans-serif; }

    /* ── Overlay ── */
    #overlay {
      position:fixed; inset:0; z-index:200;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:#000; color:#fff; text-align:center; padding:2rem;
    }
    .ov-tag   { font-size:.7rem; letter-spacing:.35em; text-transform:uppercase; color:#4ecdc4; margin-bottom:.5rem; }
    .ov-name  { font-size:2rem; font-weight:300; margin-bottom:1.5rem; }
    .ov-hint  { font-size:.78rem; color:#7070a0; line-height:2; margin-bottom:2rem; }
    #btn-vr   {
      padding:.9rem 2.5rem; border:1px solid #4ecdc4; border-radius:100px;
      background:transparent; color:#4ecdc4; font-size:.95rem; letter-spacing:.08em;
      cursor:pointer; touch-action:manipulation; transition:background .2s;
    }
    #btn-vr:active { background:rgba(78,205,196,.15); }
    .desk-hint { font-size:.65rem; color:#3a3a5a; margin-top:1.5rem; letter-spacing:.06em; }

    /* ── Botón volver ── */
    #btn-back {
      position:fixed; top:1rem; left:1rem; z-index:100; display:none;
      font-size:.7rem; letter-spacing:.12em; text-transform:uppercase;
      color:rgba(255,255,255,.4); text-decoration:none;
      padding:.4rem .8rem; border:1px solid rgba(255,255,255,.1); border-radius:100px;
      transition:color .2s, border-color .2s;
    }
    #btn-back:hover { color:#4ecdc4; border-color:#4ecdc4; }

    /* ── Tabs de panel ── */
    #panel-tabs {
      position:fixed; bottom:2.8rem; left:50%; transform:translateX(-50%);
      display:none; gap:.5rem; z-index:100;
    }
    .ptab {
      padding:.38rem 1.1rem; border:1px solid rgba(255,255,255,.15); border-radius:100px;
      background:transparent; color:rgba(255,255,255,.4); font-size:.72rem;
      letter-spacing:.1em; cursor:pointer; touch-action:manipulation;
      transition:border-color .2s, color .2s, background .2s;
    }
    .ptab.active { border-color:#4ecdc4; color:#4ecdc4; background:rgba(78,205,196,.08); }

    /* ── Selector de escena ── */
    #scene-ui {
      position:fixed; bottom:1rem; width:100%; display:none;
      justify-content:center; gap:.8rem; z-index:100;
    }
    .s-dot {
      width:8px; height:8px; border-radius:50%;
      background:rgba(255,255,255,.18); border:none; cursor:pointer;
      touch-action:manipulation; transition:background .2s;
    }
    .s-dot.active { background:#4ecdc4; }

    /* ── Botón micrófono ── */
    #btn-mic {
      position:fixed; bottom:1rem; right:1.2rem; z-index:100; display:none;
      width:52px; height:52px; border-radius:50%;
      border:2px solid rgba(78,205,196,.35); background:rgba(0,0,0,.7);
      color:#4ecdc4; font-size:1.3rem; cursor:pointer; touch-action:manipulation;
      transition:border-color .2s, background .2s;
    }
    #btn-mic.listening { border-color:#e05050; color:#e05050; background:rgba(224,80,80,.12); }
    #btn-mic.processing { border-color:#f0c040; color:#f0c040; animation:pulse .8s infinite alternate; }
    @keyframes pulse { from { opacity:.5; } to { opacity:1; } }

    /* ── Status de voz ── */
    #vr-status {
      position:fixed; top:calc(50% + 1.5rem); left:50%; transform:translateX(-50%);
      font-size:.68rem; letter-spacing:.18em; text-transform:uppercase;
      color:rgba(78,205,196,.6); z-index:100; display:none;
      pointer-events:none; white-space:nowrap;
    }

    /* ── Miras VR ── */
    #crosshairs { position:fixed; inset:0; pointer-events:none; z-index:50; display:none; }
    .ch { position:absolute; top:50%; width:16px; height:16px; transform:translate(-50%,-50%); }
    .ch::before,.ch::after { content:''; position:absolute; background:rgba(255,255,255,.45); }
    .ch::before { width:1px; height:100%; left:50%; }
    .ch::after  { height:1px; width:100%; top:50%; }
    #ch-l { left:25%; } #ch-r { left:75%; }

    /* ── Label escena ── */
    #scene-label {
      position:fixed; top:1rem; left:50%; transform:translateX(-50%);
      font-size:.65rem; letter-spacing:.3em; text-transform:uppercase;
      color:#4ecdc4; z-index:100; opacity:0; transition:opacity .4s;
      pointer-events:none; white-space:nowrap; display:none;
    }
  </style>
</head>
<body>

<div id="overlay">
  <p class="ov-tag">MirrorWork VR</p>
  <h1 class="ov-name">Hola, {{ user_name }}</h1>
  <p class="ov-hint" id="ov-hint-text">
    Coloca el teléfono en el visor.<br>
    Gira para explorar tu espacio interior.
  </p>
  <button id="btn-vr">✦ Entrar</button>
  <p class="desk-hint" id="ov-desk-hint">Escritorio: arrastra · Tab: panel</p>
</div>

<a href="{% url 'dashboard' %}" id="btn-back">← Salir</a>

<div id="crosshairs" aria-hidden="true">
  <div class="ch" id="ch-l"></div>
  <div class="ch" id="ch-r"></div>
</div>
<div id="panel-tabs">
  <button class="ptab active" data-mode="perfil">◉ Perfil</button>
  <button class="ptab" data-mode="espejo">◎ Espejo</button>
</div>
<div id="scene-ui">
  <button class="s-dot active" data-i="0"></button>
  <button class="s-dot" data-i="1"></button>
  <button class="s-dot" data-i="2"></button>
  <button class="s-dot" data-i="3"></button>
</div>
<button id="btn-mic" title="Hablar con el Espejo">🎤</button>
<div id="vr-status"></div>
<div id="scene-label"></div>

<!-- Datos Django → JS -->
<script>
const VR = {
  userName:  "{{ user_name|escapejs }}",
  aesthetic: "{{ map_aesthetic }}",
  mapPct:    {{ map_pct }},
  tokens:    {{ token_balance }},
  completed: {{ completed_tests }},
  total:     {{ total_tests }},
  question:  "{{ onboarding_question|escapejs|truncatechars:72 }}",
  initScene: {{ initial_scene }},
};
const CSRF = "{{ csrf_token }}";
</script>

<script type="importmap">{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}</script>

<script type="module">
import * as THREE from 'three';
import { StereoEffect } from 'three/addons/effects/StereoEffect.js';

// ── Normalizar aesthetic (arbol/archipielago → cosmos) ────────────────────
const _aes = (VR.aesthetic === 'arbol' || VR.aesthetic === 'archipielago')
  ? 'cosmos' : VR.aesthetic;

// ── Overlay — texto por aesthetic ─────────────────────────────────────────
{
  const _hints = {
    cosmos:      'Flota en el campo kepleriano.<br>Mira hacia el horizonte de eventos.',
    mandala:     'Estás dentro del mandala sagrado.<br>Gira para explorar la geometría.',
    psychedelic: 'El campo psicodélico envuelve tu percepción.<br>Espacio: cambia escena · Tab: panel',
  };
  const _btns = {
    cosmos:      '✦ Entrar al cosmos',
    mandala:     '✦ Entrar al mandala',
    psychedelic: '✦ Entrar al campo',
  };
  const _deskhints = {
    cosmos:      'Escritorio: arrastra · Tab: panel',
    mandala:     'Escritorio: arrastra · Tab: panel',
    psychedelic: 'Escritorio: arrastra · Espacio: escena · Tab: panel',
  };
  document.getElementById('ov-hint-text').innerHTML  = _hints[_aes]  || _hints.cosmos;
  document.getElementById('btn-vr').textContent       = _btns[_aes]   || _btns.cosmos;
  document.getElementById('ov-desk-hint').textContent = _deskhints[_aes] || _deskhints.cosmos;
}

// ── Irracionales chamánicos ───────────────────────────────────────────────
const PHI = 1.61803398875, PI = Math.PI, E = Math.E, SQ7 = Math.sqrt(7);

// ── Renderer ──────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const effect = new StereoEffect(renderer);
effect.eyeSeparation = 0.064;
effect.setSize(innerWidth, innerHeight);

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(90, innerWidth/innerHeight, 0.1, 600);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  effect.setSize(innerWidth, innerHeight);
});

// ── Vertex compartido ─────────────────────────────────────────────────────
const VERT = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`;

// ── Fondo según aesthetic ─────────────────────────────────────────────────
let bgUnis = { uT: { value: 0 }, uFade: { value: 1 } };
let bgMesh = null;
let _mandalaCtx = null, _mandalaTex = null;
let _psychMats = null, _psychSpeeds = null, _psychNames = null;
let curScene = VR.initScene;

if (_aes === 'cosmos') {
  // ── VR Cosmos — partículas keplerianas con glow simulado ──────────────
  // Sin bloom (incompatible StereoEffect) — glow via multi-ring fragment + AdditiveBlending
  const BH_R = 7, N = 110000, R_MIN = 1.5, R_MAX = 140;
  const pGeo = new THREE.BufferGeometry();
  const pPos = new Float32Array(N*3), pCol = new Float32Array(N*3);
  const pAng = new Float32Array(N),   pRad = new Float32Array(N);
  const pSpd = new Float32Array(N),   pSz  = new Float32Array(N);

  for (let i = 0; i < N; i++) {
    // Distribución: 65% disco interior, 20% anillo medio, 15% halo exterior
    let r;
    const roll = Math.random();
    if      (roll < 0.65) r = R_MIN + Math.pow(Math.random(), 1.8) * 38;
    else if (roll < 0.85) r = 38 + Math.random() * 42;
    else                  r = 80 + Math.random() * (R_MAX - 80);

    const a = Math.random() * PI * 2;
    const norm = r / R_MAX;
    const diskThick = r < 40 ? 0.04 + norm * 0.3 : 0.3 + norm * 0.7;
    const y = (Math.random() - 0.5) * r * diskThick;
    pPos[i*3] = Math.cos(a)*r; pPos[i*3+1] = y; pPos[i*3+2] = Math.sin(a)*r;

    // Colores: interior blanco-dorado, medio teal, exterior azul frío
    if (r < 20) {
      pCol[i*3] = 0.95+Math.random()*0.05; pCol[i*3+1] = 0.88+Math.random()*0.12; pCol[i*3+2] = 0.70+Math.random()*0.25;
    } else if (r < 55) {
      pCol[i*3] = 0.30+Math.random()*0.50; pCol[i*3+1] = 0.75+Math.random()*0.25; pCol[i*3+2] = 0.80+Math.random()*0.20;
    } else {
      pCol[i*3] = 0.20+Math.random()*0.30; pCol[i*3+1] = 0.40+Math.random()*0.30; pCol[i*3+2] = 0.75+Math.random()*0.25;
    }

    pAng[i] = a; pRad[i] = r;
    pSpd[i] = (1.0 / Math.sqrt(r)) * 2.8 * (0.80 + Math.random() * 0.40);
    // Partículas interiores más grandes (simulan concentración de brillo)
    pSz[i]  = r < 20 ? 1.2 + Math.random()*1.8 : 0.4 + norm*norm*3.0 + Math.random()*0.6;
  }
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3));
  pGeo.setAttribute('color',    new THREE.BufferAttribute(pCol,3));
  pGeo.setAttribute('aAngle',   new THREE.BufferAttribute(pAng,1));
  pGeo.setAttribute('aRadius',  new THREE.BufferAttribute(pRad,1));
  pGeo.setAttribute('aSpeed',   new THREE.BufferAttribute(pSpd,1));
  pGeo.setAttribute('aSize',    new THREE.BufferAttribute(pSz, 1));

  const cosmosMat = new THREE.ShaderMaterial({
    uniforms: { uT:{value:0}, uFade:{value:1}, uSpeedInner:{value:2.5}, uSpeedOuter:{value:0.05}, uSizeMult:{value:3.5} },
    vertexShader:`
      uniform float uT,uSpeedInner,uSpeedOuter,uSizeMult;
      attribute float aAngle,aRadius,aSpeed,aSize;
      varying vec3 vCol; varying float vNorm;
      void main(){
        float spd=mix(uSpeedInner,uSpeedOuter,aRadius/140.0)*aSpeed;
        float ang=aAngle+uT*spd;
        vec3 pos=vec3(cos(ang)*aRadius,position.y,sin(ang)*aRadius);
        vCol=color; vNorm=aRadius/140.0;
        vec4 mv=modelViewMatrix*vec4(pos,1.0);
        gl_Position=projectionMatrix*mv;
        gl_PointSize=clamp(aSize*uSizeMult*(110.0/-mv.z),0.5,28.0);
      }`,
    fragmentShader:`
      varying vec3 vCol; varying float vNorm;
      uniform float uFade;
      void main(){
        vec2 c=gl_PointCoord-.5; float d=length(c);
        if(d>.5)discard;
        // Multi-ring glow: núcleo brillante + halo suave (simula bloom)
        float core  = smoothstep(0.50, 0.00, d);
        float halo  = smoothstep(0.50, 0.18, d) * 0.55;
        float ring  = smoothstep(0.28, 0.12, d) * smoothstep(0.04, 0.12, d) * 0.35;
        float alpha = (core + halo + ring) * uFade;
        gl_FragColor = vec4(vCol * (1.0 + (1.0-vNorm)*0.8), alpha);
      }`,
    transparent:true, vertexColors:true,
    blending:THREE.AdditiveBlending, depthWrite:false,
  });
  bgUnis = cosmosMat.uniforms;
  scene.add(new THREE.Points(pGeo, cosmosMat));

  // Disco de acreción — comparte uT con cosmosMat (bgUnis.uT se actualiza en el loop principal)
  const ringMat = new THREE.ShaderMaterial({
    uniforms: { uT: bgUnis.uT },  // mismo objeto → se actualiza automáticamente
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      varying vec2 vUv; uniform float uT;
      void main(){
        float ang=atan(vUv.y-.5,vUv.x-.5);
        float r=length(vUv-.5)*2.0;
        if(r<0.35||r>1.0)discard;
        float pulse=0.6+0.4*sin(ang*3.0+uT*1.8);
        float fade=smoothstep(1.0,0.55,r)*smoothstep(0.35,0.50,r);
        vec3 col=mix(vec3(1.0,0.6,0.2),vec3(0.3,0.9,1.0),(r-0.35)*2.0);
        gl_FragColor=vec4(col*pulse,fade*0.7);
      }`,
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide,
  });
  const ring = new THREE.Mesh(new THREE.PlaneGeometry(18,18,1,1), ringMat);
  ring.rotation.x = -Math.PI * 0.5;
  scene.add(ring);

  // Agujero negro central
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(BH_R,32,32), new THREE.MeshBasicMaterial({color:0x000000})));
  camera.position.set(0, 22, 95);

} else if (_aes === 'mandala') {
  // Canvas 2D mandala → CanvasTexture → SphereGeometry
  const mCv = document.createElement('canvas'); mCv.width = mCv.height = 2048;
  _mandalaCtx = mCv.getContext('2d');
  _mandalaTex = new THREE.CanvasTexture(mCv);
  const mSph = new THREE.Mesh(
    new THREE.SphereGeometry(100, 64, 64),
    new THREE.MeshBasicMaterial({ map: _mandalaTex, side: THREE.BackSide })
  );
  scene.add(mSph);
  camera.position.set(0, 0, 0);

} else {
  // Psychedelic: 4 shaders en esfera (más inmersivo que cilindro)
  const PSYCH_FRAGS = [
    `uniform float uT,uFade;varying vec2 vUv;const float PI=3.14159265,PHI=1.61803398875,SQ3=1.73205080;vec3 hsl(float h,float s,float l){float h6=fract(h)*6.,x=1.-abs(mod(h6,2.)-1.);vec3 r=h6<1.?vec3(1,x,0):h6<2.?vec3(x,1,0):h6<3.?vec3(0,1,x):h6<4.?vec3(0,x,1):h6<5.?vec3(x,0,1):vec3(1,0,x);return r*s*(.5+l*.5)+(1.-s)*l;}void main(){float a=vUv.x*PI*2.,d=vUv.y*10.-uT*1.4;float w=(sin(a*3.+d*1.1+uT*.5)+sin(a*5.*PHI-d*.9+uT*.7)+sin((a+d*.7)*2.5+uT*SQ3*.4))/3.;gl_FragColor=vec4(hsl(.50+w*.13,.85,.55)*max(0.,.35+w*.65)*uFade,1.);}`,
    `uniform float uT,uFade;varying vec2 vUv;const float PI=3.14159265,SQ2=1.41421356,SQ3=1.73205080;void main(){float a=vUv.x*PI*2.,d=vUv.y*12.-uT*2.5;float fr=3.5+sin(uT*SQ3*.3)*2.2,ro=uT*SQ2*.15;float li=pow(max(0.,sin(fr*(cos(ro)*a+sin(ro)*d)-uT*2.5)),5.);vec3 c=li<.5?mix(vec3(.03,0.,.06),vec3(.35,0.,.55),li*2.):mix(vec3(.35,0.,.55),vec3(1.,.92,1.),(li-.5)*2.);gl_FragColor=vec4(c*uFade,1.);}`,
    `uniform float uT,uFade;varying vec2 vUv;const float PI=3.14159265,PHI=1.61803398875,SQ7=2.64575131;vec3 hsl(float h,float s,float l){float h6=fract(h)*6.,x=1.-abs(mod(h6,2.)-1.);vec3 r=h6<1.?vec3(1,x,0):h6<2.?vec3(x,1,0):h6<3.?vec3(0,1,x):h6<4.?vec3(0,x,1):h6<5.?vec3(x,0,1):vec3(1,0,x);return r*s*(.5+l*.5)+(1.-s)*l;}void main(){float a=vUv.x*PI*2.,d=vUv.y*10.-uT*1.8;float A=uT*PHI*.2,f=4.+sin(uT*SQ7*.5)*3.;float act=(cos(f*(cos(A)*a+sin(A)*d)+uT*1.5)+cos(f*(cos(A+PI/3.)*a+sin(A+PI/3.)*d)-uT*1.5)+cos(f*(cos(A-PI/3.)*a+sin(A-PI/3.)*d)+uT*.75))/3.;gl_FragColor=vec4(hsl(fract(act*.5+uT*.04+vUv.x*.15),.9,.55)*(max(0.,act)*.85+.08)*uFade,1.);}`,
    `uniform float uT,uFade;varying vec2 vUv;const float PI=3.14159265,PHI=1.61803398875,LOGPHI=0.48121182506;vec3 hsl(float h,float s,float l){float h6=fract(h)*6.,x=1.-abs(mod(h6,2.)-1.);vec3 r=h6<1.?vec3(1,x,0):h6<2.?vec3(x,1,0):h6<3.?vec3(0,1,x):h6<4.?vec3(0,x,1):h6<5.?vec3(x,0,1):vec3(1,0,x);return r*s*(.5+l*.5)+(1.-s)*l;}void main(){float a=vUv.x*PI*2.,d=vUv.y*8.-uT*2.2;float sN=log(max(.001,abs(d)*.25+.1))/LOGPHI;float fib=(sin(a*8.-sN*2.+uT*1.3)*sin(a*13.+d*1.5-uT*.9)+sin((a+sN*.618)*5.+uT*PHI*.4))/2.;gl_FragColor=vec4(hsl(fract(fib*.4+a/(PI*2.)*.25+uT*.03),.85,.6)*(pow(max(0.,fib*.5+.5),1.4)*.9+.05)*uFade,1.);}`
  ];
  _psychSpeeds = [1.0, 2.2, 1.5, 1.9];
  _psychNames  = ['Corriente','Obsidiana','Hexagonal','Fibonacci'];
  _psychMats   = PSYCH_FRAGS.map(f => new THREE.ShaderMaterial({
    uniforms: bgUnis, vertexShader: VERT, fragmentShader: f, side: THREE.BackSide
  }));
  bgMesh = new THREE.Mesh(new THREE.SphereGeometry(100, 64, 32), _psychMats[curScene]);
  scene.add(bgMesh);
  camera.position.set(0, 0, 0);
}

// ── Dibujo mandala VR ─────────────────────────────────────────────────────
// Parámetros VR: más simetría y capas para la esfera inmersiva 360°
const _MPALS = {
  arcano: [35,  15,  50 ],   // dorado-naranja-ámbar
  blanco: [210, 240, 220],   // azul-gris suave
  nebula: [280, 320, 200],   // violeta-rosa-teal
  aurora: [45,  175, 270],   // ámbar-verde-violeta
  tiempo: [140, 160, 120],   // verde bosque
};
const _MP = {
  sym:     8,      // más pétalos para 360° inmersivo
  speed:   0.09,   // T multiplier de rotación
  alpha:   0.60,
  pal:     _MPALS.arcano,
  layers:  5,
};

function _drawMandala(T) {
  if (!_mandalaCtx) return;
  const W = _mandalaCtx.canvas.width, H = _mandalaCtx.canvas.height;
  const ctx = _mandalaCtx;
  ctx.fillStyle = '#00000c';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W/2, H/2);
  const TAU = Math.PI*2;
  const sr = Math.min(W,H) * 0.46;
  const sym = _MP.sym, rot = T * _MP.speed, alpha = _MP.alpha;
  const pal = _MP.pal;
  const hue  = (pal[0] + T * 4) % 360;
  const hue2 = (pal[1] + T * 3) % 360;
  const hue3 = (pal[2] + T * 5) % 360;

  function poly(r, n, ang) {
    return function(){
      ctx.moveTo(r*Math.cos(ang), r*Math.sin(ang));
      for(let i=1;i<=n;i++){const a=ang+TAU*i/n;ctx.lineTo(r*Math.cos(a),r*Math.sin(a));}
      ctx.closePath();
    };
  }
  function star(r, n, ang, skip) {
    return function(){
      for(let i=0;i<=n*2;i++){
        const a=ang+TAU*i/(n*2), rr=i%2===0?r:r*(skip||0.5);
        i===0?ctx.moveTo(rr*Math.cos(a),rr*Math.sin(a)):ctx.lineTo(rr*Math.cos(a),rr*Math.sin(a));
      }
      ctx.closePath();
    };
  }
  function magic(fn, h, am) {
    const a = alpha * (am||1);
    ctx.beginPath(); fn();
    ctx.strokeStyle=`hsla(${h},100%,58%,${a*0.10})`; ctx.lineWidth=22; ctx.stroke();
    ctx.beginPath(); fn();
    ctx.strokeStyle=`hsla(${h},100%,58%,${a*0.35})`; ctx.lineWidth=4; ctx.stroke();
    ctx.beginPath(); fn();
    ctx.strokeStyle=`hsla(${(h+18)%360},55%,92%,${a*0.80})`; ctx.lineWidth=1.2; ctx.stroke();
  }

  // Capas de polígonos — radio proporcional a _MP.layers
  const fracs = [0.32, 0.50, 0.65, 0.80, 0.96, 1.10].slice(0, _MP.layers + 1);
  fracs.forEach((fr, li) => {
    const r   = sr * fr;
    const r2  = rot + (li % 2 === 0 ? 0 : PI / sym);
    const h   = li % 3 === 0 ? hue : li % 3 === 1 ? hue2 : hue3;
    magic(poly(r, sym, r2), h, 0.50 + li * 0.10);
  });

  // Estrellas — dos capas
  magic(star(sr * 1.12, sym,     rot * 0.65, 0.42), hue,  0.45);
  magic(star(sr * 0.72, sym,     rot * 0.45 + PI/sym, 0.50), hue2, 0.38);
  magic(star(sr * 0.48, sym * 2, rot * 0.80, 0.55), hue3, 0.30);

  // Núcleo luminoso
  const grad = ctx.createRadialGradient(0,0,0, 0,0, sr*0.10);
  grad.addColorStop(0, `hsla(${hue},100%,88%,0.95)`);
  grad.addColorStop(1, `hsla(${hue},100%,60%,0.0)`);
  ctx.beginPath(); ctx.arc(0, 0, sr*0.10, 0, TAU);
  ctx.fillStyle = grad; ctx.fill();

  ctx.restore();
  if (_mandalaTex) _mandalaTex.needsUpdate = true;
}

// ── Canvas del panel (compartido para ambos modos) ────────────────────────
const PW = 1024, PH = 512;
const panelCanvas = document.createElement('canvas');
panelCanvas.width = PW; panelCanvas.height = PH;

// ── Estado del espejo ─────────────────────────────────────────────────────
let panelMode     = 'perfil';       // 'perfil' | 'espejo'
let espejoSession = null;
let espejoHistory = [];             // [{role, content}]
let espejoStatus  = 'idle';        // idle | listening | processing | speaking
let interimText   = '';            // transcripción en curso

// ── Helpers de canvas ─────────────────────────────────────────────────────
function _rr(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function wrapText(ctx, text, x, y, maxW, lineH, maxLines) {
  const words = text.split(' ');
  let line = '', lines = 0;
  for (let i = 0; i < words.length; i++) {
    const test = line + words[i] + ' ';
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line.trim(), x, y);
      line = words[i] + ' '; y += lineH; lines++;
      if (maxLines && lines >= maxLines) { ctx.fillText('…', x, y); return y; }
    } else { line = test; }
  }
  if (line.trim()) ctx.fillText(line.trim(), x, y);
  return y + lineH;
}

// ── Dibuja panel PERFIL ───────────────────────────────────────────────────
function drawPerfilPanel() {
  const c = panelCanvas.getContext('2d');
  c.clearRect(0,0,PW,PH);

  // Fondo
  c.fillStyle='rgba(0,0,0,0.88)';_rr(c,0,0,PW,PH,32);c.fill();
  c.strokeStyle='rgba(78,205,196,0.3)';c.lineWidth=2;_rr(c,1,1,PW-2,PH-2,31);c.stroke();
  c.fillStyle='rgba(78,205,196,0.15)';c.fillRect(40,58,PW-80,1);

  // Tag
  c.fillStyle='#4ecdc4';c.font='500 22px system-ui';c.fillText('✦  MIRRORWORK  VR',44,46);

  // Nombre
  c.fillStyle='#e2e2f0';c.font='300 68px system-ui';c.fillText(`Hola, ${VR.userName}`,44,132);

  // Barra mapa
  const bx=44,by=165,bw=PW-88,bh=16,pct=VR.mapPct/100;
  c.fillStyle='rgba(255,255,255,0.07)';_rr(c,bx,by,bw,bh,8);c.fill();
  if(pct>0){c.fillStyle='#4ecdc4';_rr(c,bx,by,bw*pct,bh,8);c.fill();}
  c.fillStyle='#7070a0';c.font='400 20px system-ui';c.fillText('Mapa interior',bx,by-8);
  c.fillStyle='#4ecdc4';c.font='600 20px system-ui';c.fillText(`${VR.mapPct}%`,bx+bw-42,by-8);

  // Stats
  const sy=222,col2=bx+330,col3=bx+660;
  [[bx,'Tests',`${VR.completed} / ${VR.total}`,'#e2e2f0'],[col2,'Fractones',`◈ ${VR.tokens}`,'#f0c040'],[col3,'Estética',{cosmos:'Cosmos',mandala:'Sagrada',psychedelic:'Psico',arbol:'Árbol',archipielago:'Archi'}[VR.aesthetic]||VR.aesthetic,'#7c6dfa']].forEach(([x,lbl,val,col])=>{
    c.fillStyle='#7070a0';c.font='400 20px system-ui';c.fillText(lbl,x,sy);
    c.fillStyle=col;c.font='600 28px system-ui';c.fillText(val,x,sy+32);
  });

  // Pregunta
  if(VR.question){
    c.fillStyle='rgba(255,255,255,0.1)';c.fillRect(44,PH-108,PW-88,1);
    c.fillStyle='rgba(255,255,255,0.35)';c.font='italic 300 21px system-ui';
    wrapText(c,`"${VR.question}"`,44,PH-72,PW-88,28,2);
  }
}

// ── Dibuja panel ESPEJO ───────────────────────────────────────────────────
function drawEspejoPanel() {
  const c = panelCanvas.getContext('2d');
  c.clearRect(0,0,PW,PH);

  // Fondo violeta suave
  c.fillStyle='rgba(0,0,0,0.88)';_rr(c,0,0,PW,PH,32);c.fill();

  const borderCol = espejoStatus==='listening' ? 'rgba(224,80,80,0.45)' :
                    espejoStatus==='processing'? 'rgba(240,192,64,0.35)' :
                    espejoStatus==='speaking'  ? 'rgba(78,205,196,0.55)' :
                                                 'rgba(124,109,250,0.3)';
  c.strokeStyle=borderCol;c.lineWidth=2;_rr(c,1,1,PW-2,PH-2,31);c.stroke();

  // Tag + status
  const statusLabel = {idle:'',listening:'● escuchando',processing:'◌ procesando',speaking:'▶ hablando'}[espejoStatus];
  c.fillStyle='#7c6dfa';c.font='500 22px system-ui';c.fillText('◎  ESPEJO  DE  CONFLICTOS',44,46);
  if(statusLabel){
    c.fillStyle= espejoStatus==='listening'?'#e05050':espejoStatus==='processing'?'#f0c040':'#4ecdc4';
    c.font='400 20px system-ui';
    c.fillText(statusLabel, PW-200, 46);
  }
  c.fillStyle='rgba(124,109,250,0.15)';c.fillRect(40,58,PW-80,1);

  // Historial (últimos 2 intercambios)
  const maxExchanges = 2;
  const msgs = espejoHistory.slice(-maxExchanges*2);
  let y = 90;
  const textW = PW - 88;

  if (msgs.length === 0 && !interimText) {
    // Estado vacío
    c.fillStyle='rgba(255,255,255,0.2)';
    c.font='300 26px system-ui';
    c.fillText('Toca el micrófono y habla.',44,y+40);
    c.font='italic 300 22px system-ui';
    c.fillStyle='rgba(255,255,255,0.12)';
    c.fillText('El Espejo escucha desde adentro del túnel.',44,y+82);
  }

  for (let i=0; i<msgs.length; i++) {
    const m = msgs[i];
    const isUser = m.role==='user';

    if (isUser) {
      c.fillStyle='rgba(255,255,255,0.4)';
      c.font='400 18px system-ui';
      c.fillText('Tú', 44, y);
      y += 24;
      c.fillStyle='rgba(255,255,255,0.75)';
      c.font='400 22px system-ui';
      y = wrapText(c, m.content, 44, y, textW, 28, 2) + 8;
    } else {
      c.fillStyle='#7c6dfa';
      c.font='400 18px system-ui';
      c.fillText('Espejo', 44, y);
      y += 24;
      c.fillStyle='#e2e2f0';
      c.font='300 22px system-ui';
      y = wrapText(c, m.content, 44, y, textW, 30, 4) + 8;
    }

    if (y > PH - 100) break;
  }

  // Transcripción en tiempo real
  if (interimText) {
    c.fillStyle='rgba(255,255,255,0.3)';
    c.font='italic 400 20px system-ui';
    wrapText(c, interimText, 44, Math.max(y, PH-90), textW, 26, 2);
  }
}

// ── Texture y material del panel ──────────────────────────────────────────
drawPerfilPanel();
const panelTex = new THREE.CanvasTexture(panelCanvas);

const PANEL_FRAG = `
  uniform sampler2D uTex; uniform float uReveal,uT;
  varying vec2 vUv;
  const float PI=3.14159265,PHI=1.61803398875,LOGPHI=0.48121182506;
  void main(){
    vec2 c=vUv-.5; float r=length(c), ang=atan(c.y,c.x);
    float pulse=0.38*sin(uT*PI*0.3731)+0.26*sin(uT*PHI*0.6247)+0.19*sin(uT*2.71828*0.4153);
    float fibVar=0.12*sin(log(max(.001,r*5.))/LOGPHI*3.-ang*2.);
    float revR=uReveal+pulse*.07*uReveal*(1.-uReveal)+fibVar*uReveal*(1.-uReveal);
    float mask=smoothstep(revR+.04,revR-.02,r*1.2);
    float edge=smoothstep(revR-.10,revR,r*1.2)*smoothstep(revR+.04,revR,r*1.2);
    vec4 tex=texture2D(uTex,vUv);
    vec3 glow=vec3(.30,.85,.78);
    vec3 col=tex.rgb*mask+glow*edge*(.7+pulse*.3);
    float alpha=max(mask*tex.a,edge*.9)*min(1.,uReveal*3.);
    gl_FragColor=vec4(col,alpha);
  }
`;
const panelUnis = { uTex:{value:panelTex}, uReveal:{value:0.0}, uT:{value:0.0} };
const panelMat  = new THREE.ShaderMaterial({
  uniforms:panelUnis, vertexShader:VERT, fragmentShader:PANEL_FRAG,
  transparent:true, side:THREE.DoubleSide,
});
const panelMesh = new THREE.Mesh(new THREE.PlaneGeometry(4.8,2.4), panelMat);
const panelRig  = new THREE.Object3D();
scene.add(panelRig);
panelRig.add(panelMesh);
panelMesh.position.set(0,-0.3,-3.2);

// ── Reveal del panel ──────────────────────────────────────────────────────
let revealProgress = 0;
let revealActive   = false;
let revealFading   = false;   // true mientras hace fade-out para cambio de modo

function startReveal(fromProgress = 0) {
  revealProgress = fromProgress;
  revealActive   = true;
}

// Cambia modo con fade chamánico (out → swap → in)
function switchPanel(mode) {
  if (mode === panelMode) return;
  revealFading = true;
  revealActive = false;
  let f = revealProgress;
  const fadeOut = () => {
    f -= 0.06;
    panelUnis.uReveal.value = Math.max(0, f);
    if (f > 0) { requestAnimationFrame(fadeOut); return; }
    // Swap
    panelMode = mode;
    if (mode === 'espejo') drawEspejoPanel();
    else drawPerfilPanel();
    panelTex.needsUpdate = true;
    document.querySelectorAll('.ptab').forEach(b => b.classList.toggle('active', b.dataset.mode===mode));
    document.getElementById('btn-mic').style.display = mode==='espejo' ? 'flex' : 'none';
    revealFading = false;
    startReveal(0);
  };
  requestAnimationFrame(fadeOut);
}

// ── Actualiza el canvas del espejo (sin reveal, solo redibuja) ────────────
function refreshEspejoPanel() {
  if (panelMode !== 'espejo') return;
  drawEspejoPanel();
  panelTex.needsUpdate = true;
  // Re-revela ligeramente la zona baja (nueva respuesta)
  if (revealProgress >= 0.9) startReveal(0.55);
}

// ── SpeechRecognition ─────────────────────────────────────────────────────
const SR_Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;

function startListening() {
  if (!SR_Ctor) { alert('Tu navegador no soporta reconocimiento de voz.\nUsa Chrome en Android.'); return; }
  recognition = new SR_Ctor();
  recognition.lang = 'es-ES';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => {
    espejoStatus = 'listening';
    interimText  = '';
    setMicState('listening');
    setStatus('escuchando…');
  };

  recognition.onresult = (e) => {
    const allResults = Array.from(e.results);
    interimText = allResults.map(r => r[0].transcript).join('');
    refreshEspejoPanel();
    if (allResults[allResults.length-1].isFinal) {
      recognition.stop();
    }
  };

  recognition.onend = () => {
    if (!interimText.trim()) {
      espejoStatus = 'idle'; setMicState('idle'); setStatus(''); refreshEspejoPanel(); return;
    }
    const finalText = interimText.trim();
    interimText = '';
    espejoHistory.push({ role:'user', content: finalText });
    espejoStatus = 'processing';
    setMicState('processing');
    setStatus('procesando…');
    refreshEspejoPanel();
    sendToEspejo(finalText);
  };

  recognition.onerror = () => {
    espejoStatus='idle'; interimText='';
    setMicState('idle'); setStatus('');
    refreshEspejoPanel();
  };

  recognition.start();
}

function stopListening() {
  if (recognition) { try { recognition.stop(); } catch(e){} }
}

// ── SpeechSynthesis ───────────────────────────────────────────────────────
const synth = window.speechSynthesis;
let voice = null;
function pickVoice() {
  const vs = synth.getVoices();
  voice = vs.find(v=>v.lang.startsWith('es')&&v.name.includes('Google'))
       || vs.find(v=>v.lang.startsWith('es'))
       || vs[0];
}
synth.addEventListener('voiceschanged', pickVoice);
pickVoice();

function speak(text) {
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.lang='es-ES'; u.rate=0.86; u.pitch=0.88;
  u.onend = () => {
    espejoStatus='idle'; setMicState('idle'); setStatus('');
    refreshEspejoPanel();
  };
  synth.speak(u);
  espejoStatus='speaking'; setMicState('idle'); setStatus('hablando…');
}

// ── API espejo ────────────────────────────────────────────────────────────
async function sendToEspejo(text) {
  try {
    const res = await fetch('/espejo/send/', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-CSRFToken': CSRF },
      body: JSON.stringify({ mensaje: text, sesion_id: espejoSession }),
    });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    espejoSession = data.sesion_id;
    const respuesta = (data.respuesta || '').trim();
    if (respuesta) {
      espejoHistory.push({ role:'assistant', content: respuesta });
      refreshEspejoPanel();
      speak(respuesta);
    }
  } catch(err) {
    espejoStatus='idle'; setMicState('idle'); setStatus('Error de conexión');
    setTimeout(()=>setStatus(''),2000);
    refreshEspejoPanel();
  }
}

// ── Helpers UI ────────────────────────────────────────────────────────────
function setMicState(state) {
  const btn = document.getElementById('btn-mic');
  btn.className = state==='listening'?'listening':state==='processing'?'processing':'';
  btn.textContent = state==='listening'?'⏹':'🎤';
}
function setStatus(txt) {
  const el = document.getElementById('vr-status');
  el.textContent = txt;
}

// ── Tiempo chamánico ──────────────────────────────────────────────────────
let T=0, lastTs=0;
function tickTime(ts) {
  const dt = Math.min((ts-lastTs)/1000,0.05); lastTs=ts;
  if (_aes === 'psychedelic' && _psychSpeeds) {
    const pulse = Math.max(0.3,1+0.40*Math.sin(T*PI*0.3731)+0.25*Math.sin(T*PHI*0.6247)+0.18*Math.sin(T*E*0.4153)+0.10*Math.sin(T*SQ7*0.5289));
    T += dt*_psychSpeeds[curScene]*pulse;
  } else {
    T += dt;
  }
  return dt;
}

// ── Transición de escena (solo psychedelic) ───────────────────────────────
let fadeDoing=false;
function triggerFade(to){
  if(!bgMesh||!_psychMats||fadeDoing||to===curScene)return; fadeDoing=true; let f=1;
  const out=()=>{f-=.07;bgUnis.uFade.value=Math.max(0,f);if(f>0){requestAnimationFrame(out);return;}
    curScene=to;bgMesh.material=_psychMats[curScene];updateDots();showLabel(_psychNames[curScene]);
    const inn=()=>{f+=.05;bgUnis.uFade.value=Math.min(1,f);if(f<1){requestAnimationFrame(inn);return;}fadeDoing=false;};
    requestAnimationFrame(inn);};requestAnimationFrame(out);
}
function updateDots(){document.querySelectorAll('.s-dot').forEach((d,i)=>d.classList.toggle('active',i===curScene));}
function showLabel(n){const el=document.getElementById('scene-label');el.textContent=n;el.style.opacity='1';setTimeout(()=>el.style.opacity='0',2200);}
let realTimer=0;

// ── Eventos ───────────────────────────────────────────────────────────────
document.querySelectorAll('.s-dot').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();triggerFade(parseInt(b.dataset.i));}));
document.querySelectorAll('.ptab').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();switchPanel(b.dataset.mode);}));

document.getElementById('btn-mic').addEventListener('pointerdown', e => {
  e.preventDefault();
  if (espejoStatus==='listening') stopListening();
  else if (espejoStatus==='idle') startListening();
});

document.addEventListener('keydown', e=>{
  if(e.code==='Space'){e.preventDefault();triggerFade((curScene+1)%4);}
  if(e.code==='Tab'){e.preventDefault();switchPanel(panelMode==='perfil'?'espejo':'perfil');}
});

// ── Device Orientation ────────────────────────────────────────────────────
let dA=0,dB=90,dG=0,gyroOK=false;
const Q_SCR=new THREE.Quaternion(-Math.sqrt(0.5),0,0,Math.sqrt(0.5));
const _eu=new THREE.Euler(),_qO=new THREE.Quaternion();
window.addEventListener('deviceorientation',e=>{if(e.alpha==null)return;gyroOK=true;dA=e.alpha||0;dB=e.beta||90;dG=e.gamma||0;},true);
function applyGyro(){
  const ori=Number(window.screen?.orientation?.angle??window.orientation??0);
  _eu.set(THREE.MathUtils.degToRad(dB),THREE.MathUtils.degToRad(dA),THREE.MathUtils.degToRad(-dG),'YXZ');
  camera.quaternion.setFromEuler(_eu);camera.quaternion.multiply(Q_SCR);
  _qO.setFromAxisAngle(new THREE.Vector3(0,0,1),-THREE.MathUtils.degToRad(ori));
  camera.quaternion.multiply(_qO);
}

// Mouse/touch drag
let drag=false,px=0,py=0,yaw=0,pitch=0;
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;});
window.addEventListener('pointerup',()=>drag=false);
window.addEventListener('pointermove',e=>{if(!drag||gyroOK)return;yaw-=(e.clientX-px)*.003;pitch-=(e.clientY-py)*.003;pitch=Math.max(-PI/2,Math.min(PI/2,pitch));px=e.clientX;py=e.clientY;});

// ── Botón de entrada ──────────────────────────────────────────────────────
document.getElementById('btn-vr').addEventListener('click', async () => {
  if (typeof DeviceOrientationEvent?.requestPermission==='function') {
    try{const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted'){alert('Permiso denegado.');return;}}catch(e){}
  }
  document.getElementById('overlay').style.display    = 'none';
  document.getElementById('btn-back').style.display   = 'block';
  document.getElementById('panel-tabs').style.display = 'flex';
  document.getElementById('crosshairs').style.display = 'block';
  document.getElementById('scene-label').style.display= 'block';
  document.getElementById('vr-status').style.display  = 'block';
  if (_aes === 'psychedelic') {
    document.getElementById('scene-ui').style.display = 'flex';
    updateDots(); showLabel(_psychNames[curScene]);
  }
  startReveal(0);
  requestAnimationFrame(loop);
});

// ── Loop ──────────────────────────────────────────────────────────────────
const _rigQ = new THREE.Quaternion();
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = tickTime(ts);

  if (_aes === 'psychedelic') {
    realTimer += dt;
    if(realTimer>=45){realTimer=0;triggerFade((curScene+1)%4);}
  }

  bgUnis.uT.value = T;
  if (_aes === 'mandala') _drawMandala(T);
  panelUnis.uT.value = T;

  // Reveal chamánico
  if (revealActive && revealProgress < 1 && !revealFading) {
    const pulse = 0.38*Math.sin(T*PI*0.3731)+0.26*Math.sin(T*PHI*0.6247);
    revealProgress = Math.min(1, revealProgress + dt*(0.28+Math.abs(pulse)*0.18));
    panelUnis.uReveal.value = revealProgress;
  }

  // Cámara
  if(gyroOK) applyGyro();
  else{_eu.set(pitch,yaw,0,'YXZ');camera.quaternion.setFromEuler(_eu);}

  // Panel sigue suavemente la mirada
  _rigQ.copy(camera.quaternion);
  panelRig.quaternion.slerp(_rigQ, 0.03);

  effect.render(scene, camera);
}
