{% extends "admin/base_site.html" %}
{% block title %}Eliminar tag | CRM{% endblock %}
{% block extrahead %}
<style>
:root { --crm-surface: #12121e; --crm-border: rgba(255,255,255,0.07); --crm-muted: #6b6878; --crm-text: #e8e4dc; --crm-accent: #c4813a; }
.crm { padding: 2rem; max-width: 480px; margin: 0 auto; }
.crm-nav { display: flex; gap: 0.25rem; margin-bottom: 2rem; border-bottom: 1px solid var(--crm-border); padding-bottom: 1rem; }
.crm-nav a { color: var(--crm-muted); text-decoration: none; font-size: 0.875rem; padding: 0.4rem 0.9rem; border-radius: 6px; }
.crm-card { background: var(--crm-surface); border: 1px solid var(--crm-border); border-radius: 10px; padding: 1.5rem; text-align: center; }
.crm-btn { display: inline-block; padding: 0.45rem 1rem; border-radius: 6px; font-size: 0.85rem; text-decoration: none; cursor: pointer; border: 1px solid var(--crm-border); color: var(--crm-muted); background: transparent; font-family: inherit; }
.crm-btn:hover { color: var(--crm-text); border-color: rgba(255,255,255,0.2); }
.crm-btn.danger { background: rgba(168,75,60,0.15); border-color: rgba(168,75,60,0.3); color: #d96355; }
</style>
{% endblock %}
{% block content %}
<div class="crm">
    <nav class="crm-nav">
        <a href="{% url 'crm:dashboard' %}">Dashboard</a>
        <a href="{% url 'crm:tags' %}">Tags</a>
    </nav>
    <div class="crm-card">
        <p style="color:var(--crm-text);margin-bottom:1.5rem;">¿Eliminar el tag <strong>{{ tag.name }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <div style="display:flex;gap:0.5rem;justify-content:center;">
                <button type="submit" class="crm-btn danger">Sí, eliminar</button>
                <a href="{% url 'crm:tags' %}" class="crm-btn">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
