<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Slide — Definición</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; color: #F0E8DC; font-family: 'Plus Jakarta Sans', sans-serif; }
.slide { width: 1080px; height: 1350px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.label { font-size: 14px; font-weight: 600; letter-spacing: 4px; text-transform: uppercase; color: #7ecfa8; padding: 12px 18px; background: rgba(0,0,0,0.6); position: absolute; top: 0; left: 0; z-index: 10; border-radius: 0 0 12px 0; }
.z1 { position: relative; z-index: 1; }
.shadow { text-shadow: 0 3px 30px rgba(0,0,0,0.8); }
.s4 { align-items: center; justify-content: center; text-align: center; padding: 80px; }
.s4 .bg { position: absolute; inset: 0; background: url('{{BG_URL}}') center/cover no-repeat; opacity: 0.25; filter: saturate(0.8) contrast(1.2); }
.s4 .dim { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.75) 100%); }
.s4 .tag { font-size: 14px; font-weight: 600; letter-spacing: 4px; text-transform: uppercase; color: #7ecfa8; margin-bottom: 28px; }
.s4 .title { font-family: 'Space Grotesk', sans-serif; font-size: 76px; font-weight: 700; line-height: 1.15; color: #F0E8DC; margin-bottom: 36px; }
.s4 .title em { font-style: italic; color: #7ecfa8; }
.s4 .body { font-size: 28px; font-weight: 300; line-height: 1.7; color: rgba(240,232,220,0.65); max-width: 720px; }
</style>
</head>
<body>
<div class="slide s4">
  <div class="bg"></div>
  <div class="dim"></div>
  <div class="label">Definición</div>
  <div class="z1">
    <div class="tag shadow">{{TAG}}</div>
    <div class="title shadow">{{TITLE}}</div>
    <div class="body shadow">{{BODY}}</div>
  </div>
</div>
</body>
</html>
