<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:ital,wght@0,300;0,400;0,600;0,700;0,900;1,900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1080px;overflow:hidden;position:relative;background:#080A12;font-family:'Space Grotesk',sans-serif;color:#E8E0D4;}

/* === FONDO: GRADIENTE VÓRTICE === */
.bg{position:absolute;inset:0;z-index:1;
  background:
    radial-gradient(ellipse 80% 65% at 50% 50%, rgba(126,207,168,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 30% 70%, rgba(126,200,207,0.04) 0%, transparent 50%),
    radial-gradient(ellipse 50% 80% at 75% 25%, rgba(100,160,140,0.03) 0%, transparent 60%),
    #080A12;}

/* === GRID SUTIL TIPO PORTAL === */
.grid-overlay{position:absolute;inset:0;z-index:2;opacity:0.03;pointer-events:none;
  background-image:
    linear-gradient(rgba(126,207,168,1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(126,207,168,1) 1px, transparent 1px);
  background-size:80px 80px;}

/* === CÍRCULOS ORBITALES FLOTANTES === */
.orbit-container{position:absolute;inset:0;z-index:3;pointer-events: none;overflow:hidden;}
.orbit{position:absolute;border-radius:50%;border:1px solid rgba(126,207,168,0.06);}

/* === PARTÍCULAS FLOTANTES (simuladas con radial gradients) === */
.particles{position:absolute;inset:0;z-index:4;pointer-events:none;}
.particle{position:absolute;border-radius:50%;}

/* === GLOW SUPERIOR COMO LUNA/ORIGEN === */
.source-glow{position:absolute;z-index:5;pointer-events:none;
  top:-150px;left:50%;transform:translateX(-50%);
  width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle, rgba(126,207,168,0.08) 0%, rgba(126,207,168,0.03) 40%, transparent 70%);
  filter:blur(2px);}

/* === RAYOS / LÍNEAS DE ENERGÍA === */
.energy-lines{position:absolute;inset:0;z-index:6;pointer-events:none;}
.energy-line{position:absolute;height:1px;transform-origin:left center;}

/* === CENTRO: CIRCULO FOCAL === */
.focal-circle{position:absolute;z-index:7;left:50%;top:48%;transform:translate(-50%,-50%);
  width:420px;height:420px;border-radius:50%;
  border:1px solid rgba(126,207,168,0.08);
  box-shadow:0 0 80px rgba(126,207,168,0.03), inset 0 0 80px rgba(126,207,168,0.02);}

/* === GLASS CARD CONTENIDO === */
.glass-card{position:absolute;z-index:10;
  left:50%;top:50%;transform:translate(-50%,-50%);
  width:680px;padding:64px 56px;text-align:center;
  background:rgba(126,207,168,0.02);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(126,207,168,0.06);
  border-radius:2px;}

/* === NAV === */
.nav{position:absolute;top:48px;left:56px;right:56px;z-index:20;
  display:flex;align-items:center;justify-content:space-between;}
.logo-wrap{display:flex;align-items:center;gap:12px;}
.logo-dot{width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,rgba(126,207,168,0.15),rgba(126,207,168,0.05));
  border:1px solid rgba(126,207,168,0.12);}
.logo-text{font-weight:600;font-size:15px;letter-spacing:0.04em;color:rgba(240,232,220,0.55);
  font-family:'Plus Jakarta Sans';}
.nav-tag{font-family:'Plus Jakarta Sans';font-size:10px;letter-spacing:0.3em;
  color:rgba(240,232,220,0.2);text-transform:uppercase;}

/* === CONTENIDO === */
.eyebrow{font-family:'Plus Jakarta Sans';font-size:11px;font-weight:500;letter-spacing:0.3em;
  text-transform:uppercase;color:rgba(126,207,168,0.45);margin-bottom:28px;}

h1{font-weight:900;font-size:88px;line-height:0.86;letter-spacing:-0.04em;
  color:#F0E8DC;margin-bottom:0;}
h1 .line{display:block;}
h1 em{font-style:italic;color:#7ecfa8;position:relative;}

.deco{width:48px;height:1px;background:linear-gradient(to right,rgba(126,207,168,0.40),transparent);margin:32px auto;}

.sub{font-family:'Plus Jakarta Sans';font-size:16px;font-weight:400;line-height:1.6;
  color:rgba(240,232,220,0.32);max-width:380px;margin:0 auto 40px;}

/* Tag de slide */
.slide-tag{display:inline-flex;align-items:center;gap:8px;
  font-family:'Plus Jakarta Sans';font-size:10px;letter-spacing:0.25em;
  text-transform:uppercase;color:rgba(240,232,220,0.2);
  padding:8px 20px;border:1px solid rgba(240,232,220,0.04);border-radius:100px;}
.slide-tag::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:rgba(126,207,168,0.40);}

/* === FOOTER === */
.footer-line{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);z-index:20;
  display:flex;align-items:center;gap:16px;}
.footer-dots{display:flex;gap:6px;}
.footer-dot{width:6px;height:6px;border-radius:50%;}
.footer-dot.active{background:rgba(126,207,168,0.70);}
.footer-dot.inactive{background:rgba(126,207,168,0.15);}
</style></head><body>

<!-- Fondo vórtice -->
<div class="bg"></div>

<!-- Grid -->
<div class="grid-overlay"></div>

<!-- Órbitas -->
<div class="orbit-container">
  <div class="orbit" style="width:350px;height:350px;top:365px;left:365px;"></div>
  <div class="orbit" style="width:500px;height:500px;top:290px;left:290px;border-color:rgba(126,200,207,0.04);"></div>
  <div class="orbit" style="width:650px;height:650px;top:215px;left:215px;border-color:rgba(126,207,168,0.025);"></div>
  <div class="orbit" style="width:800px;height:800px;top:140px;left:140px;border-color:rgba(126,207,168,0.015);"></div>
</div>

<!-- Partículas flotantes -->
<div class="particles">
  <div class="particle" style="top:20%;left:15%;width:3px;height:3px;background:rgba(126,207,168,0.25);box-shadow:0 0 8px rgba(126,207,168,0.15);"></div>
  <div class="particle" style="top:35%;right:20%;width:2px;height:2px;background:rgba(126,200,207,0.30);box-shadow:0 0 6px rgba(126,200,207,0.12);"></div>
  <div class="particle" style="top:60%;left:22%;width:2px;height:2px;background:rgba(126,207,168,0.20);"></div>
  <div class="particle" style="top:75%;right:15%;width:3px;height:3px;background:rgba(126,207,168,0.22);box-shadow:0 0 8px rgba(126,207,168,0.10);"></div>
  <div class="particle" style="top:45%;left:80%;width:2px;height:2px;background:rgba(126,200,207,0.18);"></div>
  <div class="particle" style="top:88%;left:40%;width:2px;height:2px;background:rgba(126,207,168,0.25);"></div>
  <div class="particle" style="top:12%;right:35%;width:2px;height:2px;background:rgba(126,207,168,0.15);"></div>
  <div class="particle" style="top:50%;left:88%;width:3px;height:3px;background:rgba(126,200,207,0.20);box-shadow:0 0 6px rgba(126,200,207,0.10);"></div>
</div>

<!-- Glow tipo fuente/luna -->
<div class="source-glow"></div>

<!-- Círculo focal -->
<div class="focal-circle"></div>

<!-- Nav -->
<div class="nav">
  <div class="logo-wrap">
    <div class="logo-dot"></div>
    <span class="logo-text">Endonautas</span>
  </div>
  <span class="nav-tag">Autoconocimiento</span>
</div>

<!-- Glass card contenido -->
<div class="glass-card">
  <div class="eyebrow">Antes de empezar</div>
  <h1>
    <span class="line">Entender</span>
    <span class="line">no es</span>
    <span class="line"><em>suficiente.</em></span>
  </h1>
  <div class="deco"></div>
  <p class="sub">El mapa no cambia con comprensión.<br>Cambia con proceso.</p>
  <div class="slide-tag">01 — Intro</div>
</div>

<!-- Footer dots -->
<div class="footer-line">
  <div class="footer-dots">
    <div class="footer-dot active"></div>
    <div class="footer-dot inactive"></div>
    <div class="footer-dot inactive"></div>
    <div class="footer-dot inactive"></div>
  </div>
</div>

</body></html>
