<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:ital,wght@0,300;0,400;0,600;0,700;0,900;1,900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1080px;overflow:hidden;position:relative;background:#06060E;font-family:'Space Grotesk',sans-serif;color:#E8E0D4;}

/* === CAMPO DE ESTRELLAS PROCEDURAL === */
.stars{position:absolute;inset:0;z-index:1;}

/* === GEOMETRÍA SUTIL — GRID DE CONSTELACIÓN === */
.constellation{position:absolute;inset:0;z-index:2;opacity:0.12;pointer-events:none;}
.constellation-line{position:absolute;stroke:rgba(126,207,168,0.15);stroke-width:0.5;fill:none;}
.constellation-dot{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(126,207,168,0.30);}

/* === ORBITA / CÍRCULOS DECORATIVOS === */
.orbits{position:absolute;inset:0;z-index:3;pointer-events:none;}
.orbit-ring{position:absolute;border:1px solid rgba(126,207,168,0.04);border-radius:50%;}

/* === GLOW CENTRAL MUY SUTIL === */
.central-glow{position:absolute;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(circle at 50% 45%, rgba(126,207,168,0.025) 0%, transparent 55%);}

/* === LÍNEAS HORIZONTALES EDITORIALES === */
.h-lines{position:absolute;inset:0;z-index:5;pointer-events:none;}
.h-line{position:absolute;left:0;right:0;height:1px;}

/* === MARCO / BORDE INTERIOR === */
.frame{position:absolute;inset:40px;z-index:6;pointer-events:none;
  border:1px solid rgba(240,232,220,0.03);}

/* === NAV === */
.nav{position:absolute;top:72px;left:72px;right:72px;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:20px;border-bottom:1px solid rgba(240,232,220,0.04);}
.logo-text{font-weight:600;font-size:15px;letter-spacing:0.06em;color:rgba(240,232,220,0.60);
  font-family:'Plus Jakarta Sans';}
.nav-tag{font-family:'Plus Jakarta Sans';font-size:10px;letter-spacing:0.32em;
  color:rgba(240,232,220,0.22);text-transform:uppercase;}

/* === CONTENIDO PRINCIPAL — CENTRADO === */
.content{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
  justify-content:center;align-items:center;padding:120px 100px;text-align:center;}

/* Número de sección elegante */
.section-num{font-family:'Plus Jakarta Sans';font-size:11px;font-weight:500;letter-spacing:0.35em;
  color:rgba(126,207,168,0.45);text-transform:uppercase;margin-bottom:60px;
  display:flex;align-items:center;gap:16px;}
.section-num::before{content:'';display:block;width:36px;height:1px;background:rgba(126,207,168,0.20);}
.section-num::after{content:'';display:block;width:36px;height:1px;background:rgba(126,207,168,0.20);}

/* Eyebrow */
.eyebrow{font-family:'Plus Jakarta Sans';font-size:13px;font-weight:500;letter-spacing:0.28em;
  text-transform:uppercase;color:rgba(240,232,220,0.30);margin-bottom:32px;}

/* Headline principal */
h1{font-weight:900;font-size:104px;line-height:0.86;letter-spacing:-0.045em;
  color:#F0E8DC;margin-bottom:0;max-width:900px;}
h1 .line{display:block;}
h1 em{font-style:italic;color:rgba(240,232,220,0.55);font-weight:300;}
h1 strong{font-weight:900;color:#F0E8DC;}

/* Línea decorativa */
.deco-line{width:60px;height:2px;background:linear-gradient(to right,transparent,rgba(126,207,168,0.50),transparent);margin:40px auto;}

/* Subtítulo */
.sub{font-family:'Plus Jakarta Sans';font-size:18px;font-weight:400;line-height:1.65;
  color:rgba(240,232,220,0.35);max-width:440px;margin:0 auto;}

/* === FOOTER DEL SLIDE === */
.slide-footer{position:absolute;bottom:72px;left:72px;right:72px;z-index:10;
  display:flex;align-items:center;justify-content:center;gap:8px;}
.footer-line{flex:1;height:1px;background:rgba(240,232,220,0.04);}
.slide-label{font-family:'Plus Jakarta Sans';font-size:10px;letter-spacing:0.28em;
  color:rgba(240,232,220,0.18);text-transform:uppercase;padding:0 20px;}
</style></head><body>

<!-- Campo de estrellas SVG -->
<svg class="stars" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <filter id="sglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1080" height="1080" fill="#06060E"/>
  <!-- Estrellas pequeñas -->
  <circle cx="120" cy="80" r="1.2" fill="#d2c8b9" opacity="0.5"/>
  <circle cx="340" cy="45" r="0.8" fill="#d2c8b9" opacity="0.3"/>
  <circle cx="560" cy="120" r="1.5" fill="#d2c8b9" opacity="0.6" filter="url(#sglow)"/>
  <circle cx="780" cy="60" r="1.0" fill="#d2c8b9" opacity="0.4"/>
  <circle cx="950" cy="150" r="0.8" fill="#d2c8b9" opacity="0.25"/>
  <circle cx="200" cy="250" r="1.0" fill="#d2c8b9" opacity="0.35"/>
  <circle cx="890" cy="280" r="1.3" fill="#d2c8b9" opacity="0.5" filter="url(#sglow)"/>
  <circle cx="450" cy="180" r="0.7" fill="#7ecfa8" opacity="0.3"/>
  <circle cx="670" cy="320" r="0.9" fill="#7ecfa8" opacity="0.2"/>
  <circle cx="50" cy="400" r="0.8" fill="#d2c8b9" opacity="0.4"/>
  <circle cx="1020" cy="420" r="1.1" fill="#d2c8b9" opacity="0.45" filter="url(#sglow)"/>
  <circle cx="150" cy="560" r="0.9" fill="#d2c8b9" opacity="0.3"/>
  <circle cx="900" cy="600" r="1.0" fill="#d2c8b9" opacity="0.35"/>
  <circle cx="300" cy="700" r="0.8" fill="#d2c8b9" opacity="0.25"/>
  <circle cx="750" cy="750" r="1.4" fill="#d2c8b9" opacity="0.55" filter="url(#sglow)"/>
  <circle cx="500" cy="800" r="0.7" fill="#7ec8cf" opacity="0.2"/>
  <circle cx="100" cy="900" r="1.0" fill="#d2c8b9" opacity="0.4"/>
  <circle cx="600" cy="950" r="0.8" fill="#d2c8b9" opacity="0.3"/>
  <circle cx="950" cy="870" r="1.2" fill="#d2c8b9" opacity="0.5" filter="url(#sglow)"/>
  <circle cx="400" cy="1000" r="0.9" fill="#d2c8b9" opacity="0.35"/>
  <circle cx="800" cy="1050" r="0.8" fill="#d2c8b9" opacity="0.25"/>
  <circle cx="250" cy="1070" r="1.1" fill="#d2c8b9" opacity="0.4"/>
  <!-- Estrellas medias con glow -->
  <circle cx="480" cy="90" r="2.5" fill="#7ecfa8" opacity="0.15" filter="url(#sglow)"/>
  <circle cx="720" cy="200" r="2.0" fill="#7ec8cf" opacity="0.12" filter="url(#sglow)"/>
  <circle cx="180" cy="480" r="2.0" fill="#7ecfa8" opacity="0.10" filter="url(#sglow)"/>
  <circle cx="920" cy="500" r="2.5" fill="#7ecfa8" opacity="0.12" filter="url(#sglow)"/>
  <circle cx="600" cy="680" r="1.8" fill="#7ec8cf" opacity="0.10" filter="url(#sglow)"/>
</svg>

<!-- Constelaciones SVG -->
<svg class="constellation" xmlns="http://www.w3.org/2000/svg">
  <!-- Línea superior izquierda -->
  <line x1="100" y1="120" x2="200" y2="80" stroke="rgba(126,207,168,0.06)" stroke-width="0.5"/>
  <line x1="200" y1="80" x2="280" y2="140" stroke="rgba(126,207,168,0.06)" stroke-width="0.5"/>
  <circle cx="100" cy="120" r="2" fill="rgba(126,207,168,0.12)"/>
  <circle cx="200" cy="80" r="2.5" fill="rgba(126,207,168,0.15)"/>
  <circle cx="280" cy="140" r="2" fill="rgba(126,207,168,0.12)"/>

  <!-- Línea derecha -->
  <line x1="850" y1="150" x2="920" y2="100" stroke="rgba(126,200,207,0.05)" stroke-width="0.5"/>
  <line x1="920" y1="100" x2="1000" y2="170" stroke="rgba(126,200,207,0.05)" stroke-width="0.5"/>
  <circle cx="850" cy="150" r="2" fill="rgba(126,200,207,0.10)"/>
  <circle cx="920" cy="100" r="2.5" fill="rgba(126,200,207,0.12)"/>
  <circle cx="1000" cy="170" r="2" fill="rgba(126,200,207,0.10)"/>

  <!-- Línea inferior -->
  <line x1="400" y1="980" x2="500" y2="1020" stroke="rgba(126,207,168,0.04)" stroke-width="0.5"/>
  <line x1="500" y1="1020" x2="600" y2="980" stroke="rgba(126,207,168,0.04)" stroke-width="0.5"/>
  <circle cx="400" cy="980" r="2" fill="rgba(126,207,168,0.10)"/>
  <circle cx="500" cy="1020" r="2.5" fill="rgba(126,207,168,0.12)"/>
  <circle cx="600" cy="980" r="2" fill="rgba(126,207,168,0.10)"/>
</svg>

<!-- Órbitas decorativas -->
<div class="orbits">
  <div class="orbit-ring" style="width:700px;height:700px;top:190px;left:190px;"></div>
  <div class="orbit-ring" style="width:800px;height:800px;top:140px;left:140px;border-color:rgba(126,207,168,0.02);"></div>
</div>

<!-- Glow central -->
<div class="central-glow"></div>

<!-- Líneas editoriales sutiles -->
<div class="h-lines">
  <div class="h-line" style="top:35%;background:linear-gradient(to right,transparent,rgba(240,232,220,0.03),transparent);"></div>
  <div class="h-line" style="bottom:25%;background:linear-gradient(to right,transparent,rgba(240,232,220,0.02),transparent);"></div>
</div>

<!-- Marco interior -->
<div class="frame"></div>

<!-- Nav -->
<div class="nav">
  <span class="logo-text">Endonautas</span>
  <span class="nav-tag">Autoconocimiento</span>
</div>

<!-- Contenido centrado -->
<div class="content">
  <div class="section-num">Introducción</div>
  <div class="eyebrow">Antes de empezar un nuevo proceso</div>
  <h1>
    <span class="line">Entender</span>
    <span class="line">no es</span>
    <span class="line"><em>suficiente.</em></span>
  </h1>
  <div class="deco-line"></div>
  <p class="sub">El mapa no cambia con comprensión.<br>Cambia con proceso.</p>
</div>

<!-- Footer minimal -->
<div class="slide-footer">
  <div class="footer-line"></div>
  <span class="slide-label">01 / 04</span>
  <div class="footer-line"></div>
</div>

</body></html>
