<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1080px; height:1080px;
    background:#000000;
    overflow:hidden; position:relative;
    font-family:'Space Grotesk', system-ui, sans-serif;
    color:#F0E8DC;
  }
  /* Aurora — idéntica a base.css */
  .aurora { position:absolute; border-radius:50%; filter:blur(140px); pointer-events:none; }
  .a1 { top:-10%; right:-10%; width:900px; height:900px; background:radial-gradient(circle,#062518,transparent 70%); opacity:.32; }
  .a2 { bottom:-20%; left:-15%; width:1100px; height:1100px; background:radial-gradient(circle,#04151a,transparent 70%); opacity:.38; }
  .a3 { top:38%; left:22%; width:700px; height:700px; background:radial-gradient(circle,#051210,transparent 70%); opacity:.2; }
  /* Stars + const */
  .stars-svg { position:absolute; inset:0; width:100%; height:100%; }
  .const-svg { position:absolute; inset:0; width:100%; height:100%; }
  /* Content */
  .content {
    position:absolute; inset:0;
    padding:72px 80px 64px;
    display:flex; flex-direction:column; justify-content:space-between;
    z-index:10;
  }
  .top { display:flex; align-items:center; justify-content:space-between; }
  .logo-wrap { display:flex; align-items:center; gap:14px; }
  .logo-img { width:46px; height:46px; border-radius:50%; object-fit:cover; }
  .logo-text {
    font-weight:700; font-size:19px; letter-spacing:-.01em;
    background:linear-gradient(135deg,#7ecfa8,#7ec8cf);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .tag {
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:13px; font-weight:500; letter-spacing:.18em; text-transform:uppercase;
    color:rgba(126,207,168,.65);
    padding:7px 18px; border:1px solid rgba(126,207,168,.22); border-radius:100px;
  }
  .middle { flex:1; display:flex; flex-direction:column; justify-content:center; padding:24px 0; }
  .eyebrow {
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:14px; font-weight:500; letter-spacing:.22em; text-transform:uppercase;
    color:rgba(240,232,220,.38); margin-bottom:24px;
    display:flex; align-items:center; gap:12px;
  }
  .eyebrow::before { content:''; display:block; width:24px; height:1px; background:rgba(240,232,220,.2); }
  h1 { font-weight:900; font-size:88px; line-height:.88; letter-spacing:-.04em; color:#F0E8DC; margin-bottom:32px; }
  h1 em {
    font-style:italic;
    background:linear-gradient(135deg,#7ecfa8,#7ec8cf);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .desc {
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:20px; line-height:1.65; color:rgba(240,232,220,.52); max-width:560px;
  }
  .bottom {
    display:flex; align-items:center; justify-content:space-between;
    border-top:1px solid rgba(240,232,220,.07); padding-top:24px;
  }
  .swipe {
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:14px; font-weight:600;
    color:rgba(126,207,168,.65); letter-spacing:.1em; text-transform:uppercase;
  }
  .slide-count {
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:13px; color:rgba(240,232,220,.2); letter-spacing:.1em;
  }
</style>
