<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px; height: 1080px;
    background: #04020C;
    overflow: hidden; position: relative;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    color: #F0E8DC;
  }

  /* Base gradient */
  .bg-grad {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 55% at 80% 10%, #2A0E5C 0%, transparent 60%),
      radial-gradient(ellipse 55% 50% at 10% 85%, #082E2E 0%, transparent 55%);
  }

  /* Stars — densa lluvia dispersa */
  .stars { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* Glow spots sutiles */
  .glow {
    position: absolute; border-radius: 50%;
    filter: blur(55px); pointer-events: none;
  }
  .g1 { width: 460px; height: 460px; top: -100px; right: -60px; background: #4C1D95; opacity: 0.5; }
  .g2 { width: 360px; height: 360px; bottom: -80px; left: -40px; background: #0F766E; opacity: 0.45; }

  /* Content */
  .content {
    position: absolute; inset: 0;
    padding: 72px 80px 64px;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  /* Top — logo */
  .top {
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo-wrap {
    display: flex; align-items: center; gap: 14px;
  }
  .logo-img {
    width: 46px; height: 46px;
    border-radius: 50%;
    object-fit: cover;
    opacity: 0.92;
  }
  .logo-text {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: -0.01em;
    background: linear-gradient(135deg, #7ecfa8, #7ec8cf);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .tag {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(126,207,168,0.6);
    padding: 7px 16px;
    border: 1px solid rgba(126,207,168,0.2);
    border-radius: 100px;
  }

  /* Middle */
  .middle {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center;
    padding: 24px 0;
  }
  .eyebrow {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px; font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(240,232,220,0.38);
    margin-bottom: 24px;
  }
  h1 {
    font-weight: 900;
    font-size: 88px;
    line-height: 0.88;
    letter-spacing: -0.04em;
    color: #F0E8DC;
    margin-bottom: 32px;
  }
  h1 em {
    font-style: italic;
    background: linear-gradient(135deg, #7ecfa8, #7ec8cf);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .desc {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 20px;
    line-height: 1.6;
    color: rgba(240,232,220,0.52);
    max-width: 560px;
  }

  /* Bottom */
  .bottom {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid rgba(240,232,220,0.08);
    padding-top: 24px;
  }
  .swipe {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px; font-weight: 600;
    color: rgba(126,207,168,0.65);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
  }
  .slide-count {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13px;
    color: rgba(240,232,220,0.22);
    letter-spacing: 0.1em;
  }
</style>
