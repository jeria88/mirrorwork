<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700;900&family=Plus+Jakarta+Sans:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px; height: 1080px;
    background: #06020F;
    overflow: hidden; position: relative;
    font-family: 'Space Grotesk', system-ui, sans-serif;
  }

  /* Gradiente base radial */
  .base-grad {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 75% 15%, #3B1070 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 15% 80%, #0D4A4A 0%, transparent 55%),
      radial-gradient(ellipse 50% 40% at 50% 50%, #110828 0%, transparent 70%);
  }

  /* Nebula glow central */
  .nebula {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    pointer-events: none;
  }
  .n1 { width: 580px; height: 450px; top: -80px; right: -60px; background: #5B21B6; opacity: 0.45; }
  .n2 { width: 420px; height: 380px; bottom: -60px; left: -40px; background: #0F766E; opacity: 0.40; }
  .n3 { width: 280px; height: 280px; top: 35%; left: 40%; background: #7C3AED; opacity: 0.18; filter: blur(80px); }

  /* Estrellas — SVG puntos */
  .stars { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* Grain overlay */
  .grain {
    position: absolute; inset: 0;
    opacity: 0.06;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px;
  }

  /* Content */
  .content {
    position: absolute; inset: 0;
    padding: 80px 88px 72px;
    display: flex; flex-direction: column; justify-content: space-between;
    color: #F0E8DC;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .logo {
    font-weight: 900; font-size: 20px; letter-spacing: -0.02em;
    background: linear-gradient(135deg, #7ecfa8, #7ec8cf);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .slide-num { font-family: 'Plus Jakarta Sans'; font-size: 11px; letter-spacing: 0.22em; color: rgba(240,232,220,0.28); text-transform: uppercase; }
  .middle { flex:1; display:flex; flex-direction:column; justify-content:center; padding: 36px 0 16px; }
  .eyebrow { font-family: 'Plus Jakarta Sans'; font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(240,232,220,0.35); margin-bottom: 28px; }
  h1 { font-weight: 900; font-size: 84px; line-height: 0.9; letter-spacing: -0.03em; color: #F0E8DC; margin-bottom: 36px; }
  h1 em { font-style: italic; background: linear-gradient(135deg, #7ecfa8, #7ec8cf); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .desc { font-family: 'Plus Jakarta Sans'; font-size: 17px; line-height: 1.65; color: rgba(240,232,220,0.45); max-width: 520px; }
  .bottom { display:flex; align-items:center; justify-content:space-between; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 24px; }
  .swipe { font-family: 'Plus Jakarta Sans'; font-size: 12px; font-weight: 500; color: rgba(126,207,168,0.7); letter-spacing: 0.12em; text-transform: uppercase; }
  .dots { display:flex; gap:5px; align-items:center; }
  .dot { width:5px; height:5px; border-radius:50%; background: rgba(240,232,220,0.15); }
  .dot.active { background:#7ecfa8; width:20px; border-radius:3px; }

  /* Label variante */
  .variant-label {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 0.2em; color: rgba(255,255,255,0.2);
    font-family: 'Plus Jakarta Sans'; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="base-grad"></div>
  <div class="nebula n1"></div>
  <div class="nebula n2"></div>
  <div class="nebula n3"></div>

    <circle cx="900" cy="220" r="0.7" fill="white" opacity="0.4"/>
    <circle cx="1020" cy="300" r="1.1" fill="white" opacity="0.6"/>
    <circle cx="160" cy="380" r="0.8" fill="white" opacity="0.3"/>
    <circle cx="480" cy="420" r="1.2" fill="white" opacity="0.5"/>
    <circle cx="750" cy="390" r="0.9" fill="white" opacity="0.4"/>
    <circle cx="38" cy="520" r="1.0" fill="white" opacity="0.5"/>
    <circle cx="920" cy="480" r="0.8" fill="white" opacity="0.3"/>
    <circle cx="620" cy="560" r="1.3" fill="#7ecfa8" opacity="0.6"/>
    <circle cx="200" cy="620" r="0.7" fill="white" opacity="0.4"/>

    <circle cx="740" cy="810" r="1.8" fill="white" opacity="0.6"/>
  </svg>

  <div class="grain"></div>

  <div class="content">
    <div class="top">
      <div class="logo">Endonautas</div>
      <div class="slide-num">01 / 09</div>
    </div>
    <div class="middle">
      <div class="eyebrow">Vínculos · Autoconocimiento</div>
      <h1>La pelea<br>no fue por<br>lo que <em>dijiste.</em></h1>
      <p class="desc">Fue por lo que eso activó. Y eso tiene un origen que vale la pena encontrar.</p>
    </div>
    <div class="bottom">
      <div class="swipe">Desliza →</div>
      <div class="dots">
        <div class="dot active"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>
  </div>
  <div class="variant-label">V1 — Nebula</div>
</body>
</html>
