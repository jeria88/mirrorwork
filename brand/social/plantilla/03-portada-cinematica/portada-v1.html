<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700;900&family=Plus+Jakarta+Sans:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px; height: 1080px;
    background: #000;
    overflow: hidden; position: relative;
    font-family: 'Space Grotesk', system-ui, sans-serif;
  }

  canvas { position: absolute; inset: 0; z-index: 0; }

  .const-svg {
    position: absolute; inset: 0;
    width: 1080px; height: 1080px;
    z-index: 1;
  }

  .vignette {
    position: absolute; inset: 0; z-index: 2;
    background:
      radial-gradient(ellipse 90% 90% at 50% 50%, transparent 30%, rgba(0,0,0,.60) 100%),
      linear-gradient(to bottom, rgba(0,0,0,.20) 0%, transparent 20%, transparent 80%, rgba(0,0,0,.25) 100%);
    pointer-events: none;
  }

  .content {
    position: absolute; inset: 0; z-index: 3;
    padding: 68px 84px 62px;
    display: flex; flex-direction: column; justify-content: space-between;
    color: #F0E8DC;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .logo-wrap { display: flex; align-items: center; gap: 11px; }
  .logo-img { width: 36px; height: 36px; opacity: 0.90; }
  .logo-text {
    font-weight: 900; font-size: 19px; letter-spacing: -0.02em;
    background: linear-gradient(135deg, #7ecfa8, #7ec8cf);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .tag {
    font-family: 'Plus Jakarta Sans'; font-size: 10px; letter-spacing: 0.2em;
    color: rgba(240,232,220,0.30); text-transform: uppercase;
    border: 1px solid rgba(240,232,220,0.10); border-radius: 20px; padding: 5px 13px;
  }
  .middle {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    padding: 44px 0 20px;
  }
  .eyebrow {
    font-family: 'Plus Jakarta Sans'; font-size: 11px; letter-spacing: 0.3em;
    text-transform: uppercase; color: rgba(240,232,220,0.36);
    margin-bottom: 30px;
    display: flex; align-items: center; gap: 12px;
  }
  .eyebrow::before {
    content: ''; display: block; width: 26px; height: 1px;
    background: rgba(240,232,220,0.20); flex-shrink: 0;
  }
  h1 {
    font-weight: 900; font-size: 90px; line-height: 0.87;
    letter-spacing: -0.035em; color: #F0E8DC; margin-bottom: 38px;
  }
  h1 em {
    font-style: italic;
    background: linear-gradient(135deg, #7ecfa8, #7ec8cf);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .desc {
    font-family: 'Plus Jakarta Sans'; font-size: 17px; line-height: 1.65;
    color: rgba(240,232,220,0.38); max-width: 490px;
  }
  .bottom {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,0.07); padding-top: 22px;
  }
  .swipe {
    font-family: 'Plus Jakarta Sans'; font-size: 11px; font-weight: 500;
    color: rgba(126,207,168,0.65); letter-spacing: 0.14em; text-transform: uppercase;
  }
  .slide-info { display: flex; align-items: center; gap: 18px; }
  .dots { display: flex; gap: 5px; align-items: center; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(240,232,220,0.14); }
  .dot.active { background: #7ecfa8; width: 20px; border-radius: 3px; }
  .slide-num {
    font-family: 'Plus Jakarta Sans'; font-size: 10px; letter-spacing: 0.24em;
    color: rgba(240,232,220,0.22); text-transform: uppercase;
  }
</style>
</head>
<body>
  <canvas id="c" width="1080" height="1080"></canvas>

  <!--
    CONSTELACIONES REALES (posiciones astronómicas):

    ORIÓN — hemisferio norte, visible desde Chile (dic-mar)
      Betelgeuse α  hombro izquierdo, gigante roja variable
      Bellatrix γ   hombro derecho
      Cinturón:     Alnitak ζ — Alnilam ε — Mintaka δ (3 estrellas casi horizontales)
      Saiph κ       pie izquierdo
      Rigel β       pie derecho, la más brillante de Orión (mag 0.13)

    CRUZ DEL SUR (Crux) — visible solo desde hemisferio sur, está en la bandera de Chile
      Acrux α       extremo sur del eje largo, más brillante (mag 0.77)
      Gacrux γ      extremo norte del eje largo, ligeramente rojiza
      Mimosa β      brazo este, segunda más brillante (mag 1.25)
      Delta Crucis δ brazo oeste, la más tenue de las 4 principales
  -->
  <svg class="const-svg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="gs" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="2.8" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="gl" x="-150%" y="-150%" width="400%" height="400%">
        <feGaussianBlur stdDeviation="5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <!-- Glow muy suave para estrellas medianas -->
      <filter id="gx" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="1.4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- ══════════════════════ ORIÓN ══════════════════════
         Zona superior-derecha: x 610-930, y 110-420
         La forma es un rectángulo/ampolleta: hombros arriba,
         cinturón de 3 estrellas al centro, dos pies abajo
    -->
    <g stroke="rgba(126,207,168,0.38)" stroke-width="0.75" fill="none" stroke-linecap="round">
      <!-- Hombros → Cinturón -->
      <line x1="670" y1="142" x2="716" y2="256"/>  <!-- Betelgeuse → Alnitak -->
      <line x1="848" y1="122" x2="796" y2="252"/>  <!-- Bellatrix  → Mintaka  -->
      <!-- Cinturón — ligeramente inclinado como en el cielo real -->
      <line x1="716" y1="256" x2="756" y2="252"/>  <!-- Alnitak   → Alnilam  -->
      <line x1="756" y1="252" x2="796" y2="252"/>  <!-- Alnilam   → Mintaka  -->
      <!-- Pies -->
      <line x1="716" y1="256" x2="692" y2="388"/>  <!-- Alnitak   → Saiph    -->
      <line x1="796" y1="252" x2="876" y2="372"/>  <!-- Mintaka   → Rigel    -->
    </g>

    <!-- Estrellas de Orión (radio proporcional a brillo real) -->
    <circle cx="876" cy="372" r="4.5" fill="white"    opacity="0.96" filter="url(#gl)"/> <!-- Rigel β  mag 0.13 -->
    <circle cx="670" cy="142" r="3.8" fill="#ffeacc"  opacity="0.94" filter="url(#gl)"/> <!-- Betelgeuse α 0.42 (cálida) -->
    <circle cx="848" cy="122" r="2.5" fill="white"    opacity="0.86" filter="url(#gs)"/> <!-- Bellatrix γ 1.64 -->
    <circle cx="756" cy="252" r="2.8" fill="white"    opacity="0.92" filter="url(#gs)"/> <!-- Alnilam ε  1.69 (brightest belt) -->
    <circle cx="716" cy="256" r="2.5" fill="white"    opacity="0.88" filter="url(#gs)"/> <!-- Alnitak ζ  1.74 -->
    <circle cx="796" cy="252" r="2.2" fill="white"    opacity="0.83" filter="url(#gx)"/> <!-- Mintaka δ  2.23 -->
    <circle cx="692" cy="388" r="2.1" fill="white"    opacity="0.82" filter="url(#gx)"/> <!-- Saiph κ    2.06 -->

    <!-- Estrellas periféricas de Orión — zona de la nebulosa, pi Ori, etc. -->
    <circle cx="752" cy="308" r="1.2" fill="white"    opacity="0.48"/>  <!-- zona nebulosa -->
    <circle cx="740" cy="330" r="0.9" fill="white"    opacity="0.36"/>
    <circle cx="614" cy="184" r="1.4" fill="white"    opacity="0.52"/>  <!-- pi3 Orionis -->
    <circle cx="600" cy="216" r="1.1" fill="white"    opacity="0.42"/>  <!-- pi4 -->
    <circle cx="928" cy="180" r="1.3" fill="white"    opacity="0.50"/>
    <circle cx="910" cy="310" r="1.1" fill="white"    opacity="0.40"/>

    <!-- ══════════════════════ CRUZ DEL SUR (Crux) ══════════════════════
         Zona inferior-izquierda: x 100-280, y 760-920
         Cruz inclinada ~26° como aparece en el cielo austral
         (y en la bandera de Chile)

         Eje largo: Gacrux (norte) → Acrux (sur)  — 108px, inclinación 10°
         Eje corto: Delta Crucis (oeste) → Mimosa (este) — 148px, casi horizontal
    -->
    <g stroke="rgba(126,207,168,0.38)" stroke-width="0.75" fill="none" stroke-linecap="round">
      <!-- Eje largo: norte-sur con leve inclinación este -->
      <line x1="172" y1="772" x2="192" y2="880"/>  <!-- Gacrux → Acrux  -->
      <!-- Eje corto: oeste-este, casi horizontal -->
      <line x1="110" y1="829" x2="258" y2="826"/>  <!-- Delta  → Mimosa  -->
    </g>

    <!-- Estrellas de la Cruz del Sur -->
    <circle cx="192" cy="880" r="3.5" fill="white"    opacity="0.94" filter="url(#gl)"/> <!-- Acrux α  0.77 más brillante -->
    <circle cx="258" cy="826" r="2.9" fill="white"    opacity="0.90" filter="url(#gs)"/> <!-- Mimosa β 1.25 -->
    <circle cx="172" cy="772" r="2.6" fill="#ffe0c0"  opacity="0.88" filter="url(#gs)"/> <!-- Gacrux γ 1.59 (ligeramente roja) -->
    <circle cx="110" cy="829" r="1.7" fill="white"    opacity="0.68" filter="url(#gx)"/> <!-- Delta Crucis 2.78 más tenue -->
    <!-- Epsilon Crucis — dentro de la cruz, muy tenue pero existe -->
    <circle cx="196" cy="828" r="1.0" fill="white"    opacity="0.38"/>

    <!-- ══════════════════════ ESTRELLAS AISLADAS ══════════════════════
         Estrellas brillantes reales que son referencia visual en el cielo
         y que estarían visibles junto a Orión y la Cruz del Sur
    -->
    <!-- Sirio (α Can. Maj.) — la estrella más brillante del cielo, mag -1.46 -->
    <circle cx="430" cy="864" r="4.8" fill="white"    opacity="0.97" filter="url(#gl)"/>
    <!-- Canopo (α Carinae) — 2ª más brillante, mag -0.74, sur profundo -->
    <circle cx="82"  cy="948" r="3.8" fill="#e8f4ff"  opacity="0.92" filter="url(#gl)"/>
    <!-- Proción (α CMi) — mag 0.37 -->
    <circle cx="980" cy="480" r="2.8" fill="white"    opacity="0.86" filter="url(#gs)"/>
    <!-- Aldebarán (α Tau) — mag 0.87, naranja-rojiza -->
    <circle cx="500" cy="196" r="2.6" fill="#ffcc90"  opacity="0.82" filter="url(#gs)"/>
    <!-- Cápela (α Aur) — mag 0.08, amarillenta -->
    <circle cx="318" cy="90"  r="3.2" fill="#ffe8a0"  opacity="0.90" filter="url(#gs)"/>
    <!-- Pólux (β Gem) — mag 1.14, naranja -->
    <circle cx="560" cy="280" r="2.2" fill="#ffd0a0"  opacity="0.78" filter="url(#gx)"/>
    <!-- Castor (α Gem) — mag 1.58, blanca -->
    <circle cx="528" cy="254" r="1.8" fill="white"    opacity="0.72" filter="url(#gx)"/>
    <!-- Achernar (α Eri) — mag 0.46, azul-blanca, sur profundo -->
    <circle cx="74"  cy="682" r="3.0" fill="#d8eeff"  opacity="0.88" filter="url(#gs)"/>
    <!-- Hadar / Agena (β Cen) — acompaña a la Cruz del Sur -->
    <circle cx="294" cy="902" r="2.5" fill="#e0f0ff"  opacity="0.84" filter="url(#gs)"/>
    <!-- Rigil Kentaurus (α Cen) — el más cercano al Sol, acompaña Cruz del Sur -->
    <circle cx="316" cy="878" r="3.0" fill="white"    opacity="0.90" filter="url(#gs)"/>
    <!-- Mimosa-neighbor: estrellas del Centauro que enmarcan la Cruz -->
    <circle cx="344" cy="844" r="1.6" fill="white"    opacity="0.62"/>

    <!-- Acento jade — pocas, para no sobresaturar -->
    <circle cx="146" cy="442" r="1.4" fill="#7ecfa8"  opacity="0.60" filter="url(#gx)"/>
    <circle cx="968" cy="642" r="1.2" fill="#7ec8cf"  opacity="0.52"/>
    <circle cx="440" cy="512" r="0.9" fill="#7ecfa8"  opacity="0.40"/>
  </svg>

  <!-- Vignette cinematográfico -->
  <div class="vignette"></div>

  <!-- Contenido del slide — esto cambia en cada diapositiva -->
  <div class="content">
    <div class="top">
      <div class="logo-wrap">
        <img class="logo-img" src="file:///home/nikka/Proyectos/endonautas/assets/logo.png" alt="">
        <div class="logo-text">Endonautas</div>
      </div>
      <div class="tag">Autoconocimiento</div>
    </div>

    <div class="middle">
      <div class="eyebrow">Vínculos · Patrones</div>
      <h1>La pelea<br>no fue por<br>lo que <em>dijiste.</em></h1>
      <p class="desc">Fue por lo que eso activó. Y eso tiene un origen que vale la pena encontrar.</p>
    </div>

    <div class="bottom">
      <div class="swipe">Desliza para ver →</div>
      <div class="slide-info">
        <div class="dots">
          <div class="dot active"></div>
          <div class="dot"></div><div class="dot"></div>
          <div class="dot"></div><div class="dot"></div>
          <div class="dot"></div><div class="dot"></div>
          <div class="dot"></div><div class="dot"></div>
        </div>
        <div class="slide-num">01 / 09</div>
      </div>
    </div>
  </div>

  <script>
  // Campo de estrellas — mismo sistema que endonautas.cl/base.js
  // fillRect micro-cuadrados, PRNG determinístico = misma distribución siempre
  const ctx = document.getElementById('c').getContext('2d');
  const W = 1080, H = 1080;

  let s = 74521;
  const rng = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };

  for (let i = 0; i < 800; i++) {
    const x = rng() * W, y = rng() * H, t = rng();
    let color, sz, op;

    if (t < 0.85) {
      color = 'rgb(210,200,185)';          // hueso — dominante web
      sz = rng() * 0.95 + 0.28;
      op = rng() * 0.38 + 0.06;
    } else if (t < 0.93) {
      color = '#7ecfa8';                   // jade
      sz = rng() * 0.75 + 0.25;
      op = rng() * 0.26 + 0.06;
    } else {
      color = '#7ec8cf';                   // turquesa
      sz = rng() * 0.65 + 0.25;
      op = rng() * 0.22 + 0.06;
    }

    ctx.globalAlpha = op;
    ctx.fillStyle   = color;
    ctx.fillRect(x, y, sz, sz);
  }
  ctx.globalAlpha = 1;
  </script>
</body>
</html>
