<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700;900&family=Plus+Jakarta+Sans:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px; height: 1080px;
    background: #000;
    overflow: hidden; position: relative;
    font-family: 'Space Grotesk', system-ui, sans-serif;
  }

  canvas { position: absolute; inset: 0; z-index: 0; }

  .const-svg {
    position: absolute; inset: 0;
    width: 1080px; height: 1080px;
    z-index: 1;
  }

  .vignette {
    position: absolute; inset: 0; z-index: 2;
    background: radial-gradient(ellipse 80% 80% at 50% 50%,
      transparent 35%, rgba(0,0,0,.52) 100%);
    pointer-events: none;
  }

  .content {
    position: absolute; inset: 0; z-index: 3;
    padding: 68px 84px 62px;
    display: flex; flex-direction: column; justify-content: space-between;
    color: #F0E8DC;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .logo-wrap { display: flex; align-items: center; gap: 11px; }
  .logo-img { width: 36px; height: 36px; opacity: 0.88; }
  .logo-text {
    font-weight: 900; font-size: 19px; letter-spacing: -0.02em;
    background: linear-gradient(135deg, #7ecfa8, #7ec8cf);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .tag {
    font-family: 'Plus Jakarta Sans'; font-size: 10px; letter-spacing: 0.2em;
    color: rgba(240,232,220,0.32); text-transform: uppercase;
    border: 1px solid rgba(240,232,220,0.1); border-radius: 20px; padding: 5px 13px;
  }
  .middle {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    padding: 44px 0 20px;
  }
  .eyebrow {
    font-family: 'Plus Jakarta Sans'; font-size: 11px; letter-spacing: 0.3em;
    text-transform: uppercase; color: rgba(240,232,220,0.36);
    margin-bottom: 30px;
    display: flex; align-items: center; gap: 12px;
  }
  .eyebrow::before {
    content: ''; display: block; width: 26px; height: 1px;
    background: rgba(240,232,220,0.22); flex-shrink: 0;
  }
  h1 {
    font-weight: 900; font-size: 90px; line-height: 0.87;
    letter-spacing: -0.035em; color: #F0E8DC; margin-bottom: 38px;
  }
  h1 em {
    font-style: italic;
    background: linear-gradient(135deg, #7ecfa8, #7ec8cf);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .desc {
    font-family: 'Plus Jakarta Sans'; font-size: 17px; line-height: 1.65;
    color: rgba(240,232,220,0.40); max-width: 490px;
  }
  .bottom {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,0.07); padding-top: 22px;
  }
  .swipe {
    font-family: 'Plus Jakarta Sans'; font-size: 11px; font-weight: 500;
    color: rgba(126,207,168,0.65); letter-spacing: 0.14em; text-transform: uppercase;
  }
  .slide-info { display: flex; align-items: center; gap: 18px; }
  .dots { display: flex; gap: 5px; align-items: center; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(240,232,220,0.14); }
  .dot.active { background: #7ecfa8; width: 20px; border-radius: 3px; }
  .slide-num {
    font-family: 'Plus Jakarta Sans'; font-size: 10px; letter-spacing: 0.24em;
    color: rgba(240,232,220,0.22); text-transform: uppercase;
  }
</style>
</head>
<body>
  <canvas id="c" width="1080" height="1080"></canvas>

  <!--
    Constelaciones reales:
    ORIÓN  — cuadrante superior-derecho
    OSA MAYOR (Big Dipper) — zona inferior-derecha

    Coordenadas calculadas de posiciones astronómicas reales
    (RA/Dec → proyección plana a escala para 1080×1080)
  -->
  <svg class="const-svg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Glow suave para estrellas brillantes -->
      <filter id="gs" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="2.2" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <!-- Glow fuerte para Rigel / Betelgeuse -->
      <filter id="gl" x="-120%" y="-120%" width="340%" height="340%">
        <feGaussianBlur stdDeviation="4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- ══════════════ ORIÓN ══════════════
         Las 7 estrellas principales + cinturón de 3 estrellas alineadas
         Forma: hombros arriba, cinturón al centro, pies abajo
    -->
    <g stroke="rgba(126,207,168,0.26)" stroke-width="0.65" fill="none">
      <!-- Hombro izq (Betelgeuse) → Cinturón izq (Alnitak) -->
      <line x1="672" y1="148" x2="718" y2="262"/>
      <!-- Hombro der (Bellatrix) → Cinturón der (Mintaka) -->
      <line x1="845" y1="128" x2="794" y2="258"/>
      <!-- Cinturón: Alnitak — Alnilam — Mintaka (casi horizontal, ligera inclinación real) -->
      <line x1="718" y1="262" x2="756" y2="258"/>
      <line x1="756" y1="258" x2="794" y2="258"/>
      <!-- Pie izq: Alnitak → Saiph -->
      <line x1="718" y1="262" x2="695" y2="395"/>
      <!-- Pie der: Mintaka → Rigel -->
      <line x1="794" y1="258" x2="876" y2="382"/>
    </g>

    <!-- Estrellas de Orión — tamaño proporcional a magnitud visual real -->
    <!-- Rigel β — mag 0.13, la más brillante (pie derecho, azul-blanca) -->
    <circle cx="876" cy="382" r="4.2" fill="white" opacity="0.96" filter="url(#gl)"/>
    <!-- Betelgeuse α — mag 0.42, 2ª brillo (hombro izq, cálida) -->
    <circle cx="672" cy="148" r="3.6" fill="#ffe8d0" opacity="0.93" filter="url(#gl)"/>
    <!-- Bellatrix γ — mag 1.64 (hombro der) -->
    <circle cx="845" cy="128" r="2.3" fill="white" opacity="0.84" filter="url(#gs)"/>
    <!-- Alnilam ε — mag 1.69, central del cinturón, ligeramente más brillante -->
    <circle cx="756" cy="258" r="2.6" fill="white" opacity="0.90" filter="url(#gs)"/>
    <!-- Alnitak ζ — mag 1.74 (cinturón izq) -->
    <circle cx="718" cy="262" r="2.4" fill="white" opacity="0.87" filter="url(#gs)"/>
    <!-- Mintaka δ — mag 2.23 (cinturón der, algo más tenue) -->
    <circle cx="794" cy="258" r="2.1" fill="white" opacity="0.81" filter="url(#gs)"/>
    <!-- Saiph κ — mag 2.06 (pie izquierdo) -->
    <circle cx="695" cy="395" r="2.0" fill="white" opacity="0.80" filter="url(#gs)"/>

    <!-- Estrellas periféricas de Orión (pi Ori, etc.) — dan volumen -->
    <circle cx="612" cy="192" r="1.4" fill="white" opacity="0.52"/>
    <circle cx="600" cy="224" r="1.1" fill="white" opacity="0.42"/>
    <circle cx="920" cy="190" r="1.2" fill="white" opacity="0.48"/>
    <circle cx="936" cy="312" r="1.0" fill="white" opacity="0.38"/>
    <circle cx="752" cy="204" r="1.0" fill="white" opacity="0.35"/>

    <!-- ══════════════ OSA MAYOR — Big Dipper ══════════════
         La olla (4 estrellas formando un rectángulo/trapecio)
         + el mango (3 estrellas formando una curva)
         Forma inconfundible de cazo/cucharón
    -->
    <g stroke="rgba(126,207,168,0.20)" stroke-width="0.60" fill="none">
      <!-- Olla (bowl): Dubhe → Merak → Phad → Megrez → Dubhe -->
      <line x1="622" y1="800" x2="684" y2="868"/>
      <line x1="684" y1="868" x2="804" y2="884"/>
      <line x1="804" y1="884" x2="840" y2="812"/>
      <line x1="840" y1="812" x2="622" y2="800"/>
      <!-- Mango (handle): Megrez → Alioth → Mizar → Alkaid (curva real) -->
      <line x1="840" y1="812" x2="952" y2="792"/>
      <line x1="952" y1="792" x2="1044" y2="826"/>
      <line x1="1044" y1="826" x2="1068" y2="878"/>
    </g>

    <!-- Estrellas de la Osa Mayor — magnitudes reales -->
    <!-- Dubhe α — mag 1.79 (estrella de puntero, borde externo de la olla) -->
    <circle cx="622" cy="800" r="2.4" fill="white" opacity="0.86" filter="url(#gs)"/>
    <!-- Merak β — mag 2.37 (puntero inferior) -->
    <circle cx="684" cy="868" r="2.0" fill="white" opacity="0.80"/>
    <!-- Phad γ — mag 2.44 -->
    <circle cx="804" cy="884" r="1.9" fill="white" opacity="0.77"/>
    <!-- Megrez δ — mag 3.31, la más tenue del cazo -->
    <circle cx="840" cy="812" r="1.5" fill="white" opacity="0.60"/>
    <!-- Alioth ε — mag 1.77, la más brillante del mango -->
    <circle cx="952" cy="792" r="2.5" fill="white" opacity="0.88" filter="url(#gs)"/>
    <!-- Mizar ζ — mag 2.27 (estrella doble famosa) -->
    <circle cx="1044" cy="826" r="2.1" fill="white" opacity="0.82"/>
    <!-- Alkaid η — mag 1.86 (fin del mango) -->
    <circle cx="1068" cy="878" r="2.2" fill="white" opacity="0.84" filter="url(#gs)"/>

    <!-- Estrellas aisladas brillantes — dan profundidad al cielo real -->
    <!-- Sirio (referencia visual, zona inferior-izquierda) -->
    <circle cx="118" cy="862" r="3.0" fill="white" opacity="0.88" filter="url(#gs)"/>
    <!-- Aldebarán (zona media) -->
    <circle cx="490" cy="192" r="2.2" fill="#ffcca0" opacity="0.72" filter="url(#gs)"/>
    <!-- Cápela -->
    <circle cx="320" cy="96" r="2.0" fill="#ffe8c0" opacity="0.68" filter="url(#gs)"/>
    <!-- Proción -->
    <circle cx="968" cy="512" r="1.8" fill="white" opacity="0.65" filter="url(#gs)"/>
    <!-- Pólux -->
    <circle cx="548" cy="298" r="1.6" fill="#ffd8b0" opacity="0.60"/>
    <!-- Castor -->
    <circle cx="518" cy="274" r="1.3" fill="white" opacity="0.55"/>
    <!-- Estrella jade de acento -->
    <circle cx="144" cy="450" r="1.5" fill="#7ecfa8" opacity="0.58" filter="url(#gs)"/>
    <circle cx="966" cy="648" r="1.3" fill="#7ec8cf" opacity="0.50"/>
  </svg>

  <!-- Vignette cinematográfico -->
  <div class="vignette"></div>

  <!-- Contenido -->
  <div class="content">
    <div class="top">
      <div class="logo-wrap">
        <img class="logo-img" src="file:///home/nikka/Proyectos/endonautas/assets/logo.png" alt="">
        <div class="logo-text">Endonautas</div>
      </div>
      <div class="tag">Autoconocimiento</div>
    </div>

    <div class="middle">
      <div class="eyebrow">Vínculos · Patrones</div>
      <h1>La pelea<br>no fue por<br>lo que <em>dijiste.</em></h1>
      <p class="desc">Fue por lo que eso activó. Y eso tiene un origen que vale la pena encontrar.</p>
    </div>

    <div class="bottom">
      <div class="swipe">Desliza para ver →</div>
      <div class="slide-info">
        <div class="dots">
          <div class="dot active"></div>
          <div class="dot"></div><div class="dot"></div>
          <div class="dot"></div><div class="dot"></div>
          <div class="dot"></div><div class="dot"></div>
          <div class="dot"></div><div class="dot"></div>
        </div>
        <div class="slide-num">01 / 09</div>
      </div>
    </div>
  </div>

  <script>
  // Canvas star field — mismo sistema que la web (fillRect, PRNG determinístico)
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = 1080, H = 1080;

  // LCG determinístico (mismo seed = misma distribución siempre)
  let s = 74521;
  function rng() {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  }

  for (let i = 0; i < 720; i++) {
    const x  = rng() * W;
    const y  = rng() * H;
    const t  = rng();
    let color, sz, op;

    if (t < 0.85) {
      // Hueso — color dominante del cielo web
      color = 'rgb(210,200,185)';
      sz  = rng() * 0.95 + 0.25;
      op  = rng() * 0.36 + 0.06;
    } else if (t < 0.93) {
      // Jade
      color = '#7ecfa8';
      sz  = rng() * 0.75 + 0.25;
      op  = rng() * 0.26 + 0.06;
    } else {
      // Turquesa
      color = '#7ec8cf';
      sz  = rng() * 0.65 + 0.25;
      op  = rng() * 0.22 + 0.06;
    }

    ctx.globalAlpha = op;
    ctx.fillStyle   = color;
    ctx.fillRect(x, y, sz, sz);
  }
  ctx.globalAlpha = 1;
  </script>
</body>
</html>
