[build]
builder = "nixpacks"

[deploy]
startCommand = "python manage.py prepare_db && python manage.py migrate --fake-initial && python manage.py migrate_mirrorwork_data && python manage.py seed_wagtail && python manage.py seed_centro && python manage.py seed_missions && python manage.py seed_tests && python manage.py seed_mirror_kb && python manage.py seed_admin && python manage.py seed_packs && python manage.py collectstatic --noinput && gunicorn config.wsgi --workers 1 --timeout 300 --log-file -"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
